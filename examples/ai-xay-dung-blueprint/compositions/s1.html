        /* Each scene declares its fonts (HyperFrames lint: font_family_without_font_face). Paths are relative to index.html. */
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Regular.ttf"); font-weight: 400; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Medium.ttf"); font-weight: 500; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-ExtraBold.ttf"); font-weight: 800; }
        @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Variable.ttf"); font-weight: 100 800; }
        #s1-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: transparent;
          color: var(--line);
          font-family: "Be Vietnam Pro", sans-serif;
        }
        #s1-stage { position: absolute; inset: 0; transform-origin: 56% 48%; }
        #s1-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        /* line work: four weights, round caps */
        #s1-root .ln { fill: none; stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; }
        #s1-root .out { stroke-width: var(--w-out); }
        #s1-root .det { stroke-width: var(--w-det); }
        #s1-root .thin { stroke-width: var(--w-thin); }
        #s1-root .hair { stroke-width: var(--w-hair); }
        #s1-root .soft { stroke: var(--line-soft); }
        #s1-root .cl { stroke-dasharray: 22 6 4 6; }   /* centre line */
        #s1-root .hid { stroke-dasharray: 10 7; }      /* hidden line */
        /* "paper" fill painted under an outline (painter's order) */
        #s1-root .pf { fill: var(--fill); stroke: none; opacity: 0; }
        #s1-root .pff { fill: var(--fill); stroke: none; }
        #s1-root .dot { fill: var(--line); stroke: none; }
        #s1-root .nib { fill: var(--line); stroke: none; opacity: 0; }
        #s1-root svg text {
          font-family: "JetBrains Mono", monospace; font-weight: 700; fill: var(--line);
          text-anchor: middle; dominant-baseline: central;
        }
        /* labels are lettered on left to right with clip-path */
        #s1-root .tx { position: absolute; white-space: nowrap; line-height: 1.3; padding: 6px 4px; clip-path: inset(0 100% 0 0); }
        #s1-root .vi { font-family: "Be Vietnam Pro", sans-serif; font-weight: 700; letter-spacing: 0.06em; }
        #s1-root .mono { font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: 0.06em; }
        #s1-root .num { width: 92px; text-align: center; font-size: 26px; font-weight: 600; transform: rotate(-90deg); }
        #s1-root .ctr { transform: translateX(-50%); }
      </style>

      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s1", key);
          const NS = "http://www.w3.org/2000/svg";
          const $ = (id) => document.getElementById("s1-" + id);
          const sc = window.__vv.scenes["s1"];
          const S = sc.start, D = sc.end - sc.start;
          const BEAT = 60 / 104;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          const nb = (t) => Math.round((S + t) / BEAT) * BEAT - S; // nearest beat
          const defs = $("defs"), nibs = $("nibs");
          const mk = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            if (parent) parent.appendChild(e);
            return e;
          };

          // generated line work (deterministic loops)
          [[805, 880], [1045, 1120]].forEach(([y0, y1], f) => {
            for (let x = 518, i = 0; x <= 824; x += 19, i++) mk("path", { id: `s1-bal${f}-${i}`, class: "ln thin soft", d: `M${x} ${y0 + 9} V${y1 - 3}` }, $("bals"));
          });
          for (let x = 432, i = 0; x <= 890; x += 12, i++) mk("path", { id: `s1-ht${i}`, class: "ln hair soft", d: `M${x} 1408 L${x + 28} 1380` }, $("hatch"));
          const tick = (x, y, id) => mk("path", { id, class: "ln det", d: `M${x - 8} ${y + 8} L${x + 8} ${y - 8}` }, $("dims"));
          [578, 650, 880, 1120, 1380].forEach((y, i) => tick(930, y, `s1-tk1-${i}`));
          [578, 1380].forEach((y, i) => tick(975, y, `s1-tk2-${i}`));

          const tl = gsap.timeline({ paused: true });
          let mid = 0;

          // draw-on by arc length with a glowing nib riding the head of the stroke
          function draw(el, t, dur, o = {}) {
            if (typeof el === "string") el = $(el);
            let tgt = el;
            if (el.dataset.dash) {
              // dashed convention lines: reveal through a solid mask path so the dash pattern stays put
              const m = mk("mask", { id: "s1-mk" + mid++, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1080, height: 1920 }, defs);
              tgt = mk("path", { d: el.getAttribute("d"), fill: "none", stroke: "#fff", "stroke-width": 16, "stroke-linecap": "round" }, m);
              el.setAttribute("mask", "url(#" + m.id + ")");
            }
            const L = tgt.getTotalLength();
            tgt.style.strokeDasharray = L + " " + (L + 2);
            const tw = { strokeDashoffset: 0, duration: dur, ease: o.ease || "power1.inOut" };
            if (o.nib !== false) {
              const p0 = tgt.getPointAtLength(0);
              const nib = mk("circle", { r: 4, cx: p0.x, cy: p0.y, class: "nib", filter: "url(#s1-glow)" }, nibs);
              tw.onUpdate = function () {
                const p = tgt.getPointAtLength(L * this.ratio);
                nib.setAttribute("cx", p.x);
                nib.setAttribute("cy", p.y);
              };
              tl.fromTo(nib, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, t);
              tl.to(nib, { opacity: 0, duration: 0.08, ease: "none" }, t + dur - 0.02);
            }
            tl.fromTo(tgt, { strokeDashoffset: L }, tw, t);
          }
          const paper = (id, t) => tl.fromTo($(id), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
          const write = (id, t, dur) => tl.fromTo($(id), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "power1.inOut" }, t);
          const pop = (id, t, dur = 0.4) => tl.fromTo($(id), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: dur, ease: "back.out(1.6)" }, t);
          const pulse = (id, t, k = 1.07) => {
            tl.fromTo($(id), { scale: 1 }, { scale: k, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo($(id), { scale: k }, { scale: 1, duration: 0.22, ease: "power2.out", immediateRender: false }, t + 0.08);
          };
          // a signal pulse running along a leader into the house
          const signal = (pathId, dotId, t) => {
            const p = $(pathId), L = p.getTotalLength(), p0 = p.getPointAtLength(0);
            const c = mk("circle", { r: 6, cx: p0.x, cy: p0.y, class: "nib", filter: "url(#s1-glow)" }, nibs);
            const o = { v: 0 };
            tl.fromTo(o, { v: 0 }, {
              v: 1, duration: 0.45, ease: "power1.in", immediateRender: false,
              onUpdate: () => { const q = p.getPointAtLength(L * o.v); c.setAttribute("cx", q.x); c.setAttribute("cy", q.y); },
            }, t);
            tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t);
            tl.to(c, { opacity: 0, duration: 0.08, ease: "none" }, t + 0.42);
            pulse(dotId, t + 0.44, 1.7);
          };

          // camera: very slow push-in over the whole scene
          tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

          // opening: the figure frame draws itself, title lettered on
          ["c1", "c2", "c3", "c4"].forEach((id, i) => draw(id, 0.02 + i * 0.06, 0.4));
          write("title", 0.05, 0.45);
          draw("ul", 0.2, 0.45);

          // "Trong ngành xây dựng": drafting order, one layer per beat
          const T0 = nb(A("xd"));            // centre lines + ground
          draw("axA", T0, 0.55);
          draw("axB", T0 + 0.08, 0.55);
          draw("axAc", T0 + 0.12, 0.3);
          draw("axBc", T0 + 0.2, 0.3);
          tl.fromTo(["#s1-axAt", "#s1-axBt"], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.08, ease: "none" }, T0 + 0.38);
          draw("gnd", T0 + 0.05, 0.5);

          const T1 = T0 + BEAT;              // outlines (paper first)
          paper("bf", T1);
          draw("bwl", T1, 0.55);
          draw("bwr", T1 + 0.06, 0.55);
          draw("par", T1 + 0.18, 0.35);
          paper("copf", T1 + 0.26); draw("cop", T1 + 0.26, 0.3);
          ["sl0", "sl1", "sl2"].forEach((id, i) => { paper(id + "f", T1 + 0.3 + i * 0.06); draw(id, T1 + 0.3 + i * 0.06, 0.3); });

          const T2 = T0 + 2 * BEAT;          // details: doors, windows
          ["d3", "w3l", "w3r", "d2", "w2l", "w2r", "g", "stp"].forEach((id, i) => draw(id, T2 + i * 0.045, 0.3));
          ["d3m", "d3t", "w3lm", "w3rm", "d2m", "d2t", "w2lm", "w2rm", "gt", "g1", "g2", "g3"].forEach((id, i) => draw(id, T2 + 0.2 + i * 0.025, 0.16, { nib: false }));

          // "AI không chỉ để trò chuyện": a chat bubble, then struck through
          const TB = nb(A("chat") - 0.55);
          paper("bubf", TB);
          draw("bubo", TB, 0.32);
          draw("bl1", TB + 0.22, 0.12);
          draw("bl2", TB + 0.29, 0.1);
          ["bd1", "bd2", "bd3"].forEach((id, i) => {
            pop(id, TB + 0.33 + i * 0.04, 0.16);
            tl.fromTo($(id), { y: 0 }, { y: -8, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, TB + 0.45 + i * 0.05);
          });
          const TC = nb(A("chat"));
          draw("x1", TC, 0.22, { ease: "power2.in" });
          draw("x2", TC + BEAT / 2, 0.22, { ease: "power2.in" });
          tl.fromTo("#s1-bub", { opacity: 1 }, { opacity: 0.3, duration: 0.35, ease: "power1.out", immediateRender: false }, TC + BEAT);
          tl.fromTo("#s1-bub", { y: 0 }, { y: -12, duration: A("ks") - TC - BEAT, ease: "none", immediateRender: false }, TC + BEAT);

          const T3 = TC + BEAT;              // balconies, roof tank, figure label
          paper("r3f", T3); draw("r3", T3, 0.35);
          paper("r2f", T3 + 0.12); draw("r2", T3 + 0.12, 0.35);
          gsap.utils.toArray("#s1-bals path").forEach((el, i) => draw(el, T3 + 0.2 + i * 0.012, 0.1, { nib: false }));
          paper("tkf", T3 + 0.08); draw("tk", T3 + 0.08, 0.32); draw("tkl", T3 + 0.36, 0.12, { nib: false });
          write("md", T3 + 0.15, 0.5);
          draw("mdu", T3 + 0.3, 0.4);

          // "Ba khái niệm": soil hatching + three placement marks
          const T4 = T3 + BEAT;
          gsap.utils.toArray("#s1-hatch path").forEach((el, i) => draw(el, T4 + i * 0.01, 0.12, { nib: false }));
          ["pk1", "pk2", "pk3"].forEach((id, i) => {
            draw(id, T4 + 0.06 + i * 0.1, 0.2, { nib: false });
            tl.fromTo($(id), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 90, duration: 0.5, ease: "power2.inOut", immediateRender: false }, T4 + 0.3 + i * 0.1);
          });

          // ① AGENT  ② SKILL  ③ MCP: balloons pop on each word, leaders point into the house
          const BAL = [["b1", "ld1", "dt1", "lb1", "agent"], ["b2", "ld2", "dt2", "lb2", "skill"], ["b3", "ld3", "dt3", "lb3", "mcp"]];
          BAL.forEach(([b, ld, dt, lb, key]) => {
            const t = A(key);
            pop(b, t);
            draw(ld, t + 0.08, 0.38);
            pop(dt, t + 0.44, 0.22);
            write(lb, t + 0.12, 0.35);
            beats(t + 0.5, 7.9).forEach((bt) => pulse(b, bt));
          });

          // "đang biến nó thành": height dimension chain measures the house
          const T5 = nb(A("mcp") + 0.6);
          ["ex0", "ex1", "ex2", "ex3", "ex4"].forEach((id, i) => draw(id, T5 + i * 0.04, 0.22, { nib: false }));
          draw("dm1", T5 + 0.12, 0.5);
          [0, 1, 2, 3, 4].forEach((i) => draw("tk1-" + i, T5 + 0.3 + i * 0.05, 0.1, { nib: false }));
          ["n1", "n2", "n3", "n4"].forEach((id, i) => write(id, T5 + 0.4 + i * 0.07, 0.3));
          BAL.forEach(([, ld, dt]) => signal(ld, dt, T5));
          const T6 = T5 + BEAT;
          draw("dm2", T6, 0.4);
          draw("tk2-0", T6 + 0.02, 0.1, { nib: false });
          draw("tk2-1", T6 + 0.36, 0.1, { nib: false });
          write("vd", T6 + 0.06, 0.3);
          write("n5", T6 + 0.2, 0.35);

          // "kỹ sư trợ lý thật sự": the chat bubble gives way to a safety helmet
          const TK = A("ks");
          tl.fromTo("#s1-bub", { opacity: 0.3 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, TK - 0.05);
          draw("hcl", TK, 0.4);
          paper("hshf", TK + 0.05); draw("hsh", TK + 0.05, 0.45);
          paper("hbrf", TK + 0.22); draw("hbr", TK + 0.22, 0.35);
          draw("hr1", TK + 0.36, 0.24);
          draw("hr2", TK + 0.4, 0.24);
          draw("hs1", TK + 0.46, 0.2, { nib: false });
          draw("hs2", TK + 0.5, 0.2, { nib: false });
          draw("hband", TK + 0.52, 0.3);
          write("ks", TK + 0.3, 0.55);
          draw("kr1", TK + 0.7, 0.3, { nib: false });
          draw("kr2", TK + 0.76, 0.3, { nib: false });
          const TK2 = nb(TK + 0.2);
          BAL.forEach(([, ld, dt]) => signal(ld, dt, TK2));
          const TH = nb(TK + 0.75);
          draw("hld", TH, 0.3);
          pop("hdt", TH + 0.28, 0.2);

          // exit: lateral pan to the left, to the next figure on the same sheet
          tl.fromTo("#s1-stage", { x: 0, opacity: 1 }, { x: -220, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, D - 0.3);

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
