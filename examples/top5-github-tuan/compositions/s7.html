      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s7", key);
          const BEAT = 60 / 104, S = window.__vv.scenes["s7"].start;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          const HB = BEAT / 2;
          const halfBeats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / HB); k * HB - S <= to; k++) o.push(k * HB - S); return o; };
          const nextHB = (t) => halfBeats(t, t + 1)[0];
          const END = 7.54, HOLD = END - 0.3; // last scene: hold the final 0.3 s, no CRT-off
          const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          const cssv = (name, fb) => (getComputedStyle(document.documentElement).getPropertyValue(name) || "").trim() || fb;
          const ACC = cssv("--accent", "#b7f34a"), INK = cssv("--ink", "#f2f4f8"), GLOW = cssv("--accent-glow", "rgba(183, 243, 74, 0.45)");
          const H = (i, s) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };

          const tl = gsap.timeline({ paused: true });
          const pulse = (el, b, s = 1.04) => {
            tl.to(el, { scale: s, duration: 0.08, ease: "power2.out" }, b);
            tl.to(el, { scale: 1, duration: 0.2, ease: "power2.inOut" }, b + 0.08);
          };

          // ---------- Camera, whip-in entrance ----------
          tl.fromTo("#s7-stage", { scale: 1.12, x: 160, opacity: 0, filter: "blur(8px)" }, { scale: 1, x: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#s7-cam", { scale: 1 }, { scale: 1.05, duration: HOLD, ease: "power1.inOut" }, 0);

          // ---------- Layer 3: data packets on grid lines (hash placement, launch on half-beats) ----------
          const env = document.getElementById("s7-env");
          const COLS = ["var(--c1)", "var(--c2)", "var(--c3)"];
          for (let i = 0; i < 18; i++) {
            const c = COLS[i % 3];
            const horiz = H(i, 1) < 0.5;
            const cells = 6 + Math.floor(H(i, 2) * 8);
            const dir = H(i, 3) < 0.5 ? 1 : -1;
            let x0, y0, x1, y1, rot;
            if (horiz) {
              const m = 3 + Math.floor(H(i, 4) * 31);
              y0 = y1 = 48 * m;
              const a = 1 + Math.floor(H(i, 5) * (21 - cells));
              const xa = 12 + 48 * a, xb = 12 + 48 * (a + cells);
              x0 = dir > 0 ? xa : xb; x1 = dir > 0 ? xb : xa; rot = dir > 0 ? 0 : 180;
            } else {
              const k = 1 + Math.floor(H(i, 4) * 21);
              x0 = x1 = 12 + 48 * k;
              const a = 3 + Math.floor(H(i, 5) * (31 - cells));
              const ya = 48 * a, yb = 48 * (a + cells);
              y0 = dir > 0 ? ya : yb; y1 = dir > 0 ? yb : ya; rot = dir > 0 ? 90 : 270;
            }
            const size = 6 + Math.floor(H(i, 9) * 5);
            const trail = 60 + Math.floor(H(i, 10) * 60);
            const p = document.createElement("div");
            p.className = "pk";
            p.innerHTML = '<i class="tr" style="width:' + trail + 'px;background:linear-gradient(90deg,transparent,' + c + ')"></i>' +
              '<b class="dt" style="width:' + size + 'px;height:' + size + 'px;left:' + (-size / 2) + 'px;top:' + (-size / 2) + 'px;background:' + c + ';box-shadow:0 0 10px ' + c + '"></b>';
            env.appendChild(p);
            gsap.set(p, { x: x0, y: y0, rotation: rot, opacity: 0 });
            const dur = (cells * 48) / (280 + H(i, 6) * 200);
            const period = Math.ceil((dur + 0.15 + H(i, 7) * 0.6) / HB) * HB;
            for (let t = nextHB(0.15 + H(i, 8) * 1.4); t + dur <= HOLD - 0.04; t += period) {
              tl.fromTo(p, { x: x0, y: y0 }, { x: x1, y: y1, duration: dur, ease: "none", immediateRender: false }, t);
              tl.fromTo(p, { opacity: 0 }, { opacity: 0.9, duration: 0.12, ease: "none", immediateRender: false }, t);
              tl.to(p, { opacity: 0, duration: 0.15, ease: "none" }, t + dur - 0.15);
            }
          }
          // grid nodes tick on every beat
          beats(0.5, HOLD - 0.3).forEach((b) => {
            tl.to("#s7-env .nd", { scale: 1.5, opacity: 0.85, duration: 0.08, ease: "power2.out" }, b);
            tl.to("#s7-env .nd", { scale: 1, opacity: 0.35, duration: 0.24, ease: "power2.inOut" }, b + 0.08);
          });

          // ---------- Sentence 1: "Năm repo, năm cách làm việc nhanh hơn" ----------
          const tA = A("nam");
          tl.fromTo("#s7-lab", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.out" }, tA - 0.06);
          tl.fromTo("#s7-date", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, tA);
          tl.fromTo("#s7-title", { yPercent: 110 }, { yPercent: 0, duration: 0.42, ease: "back.out(1.4)" }, tA);
          tl.fromTo("#s7-tsw", { xPercent: -120 }, { xPercent: 450, duration: 0.8, ease: "power2.inOut" }, tA + 0.2);

          // five rows fly in on consecutive half-beats along a curved path (x and y on different eases)
          const STARS = [8319, 7084, 6566, 4003, 2601];
          const land = halfBeats(tA + 0.25, 4).slice(0, 5);
          STARS.forEach((v, i) => {
            const n = i + 1, L = land[i], t0 = L - 0.34;
            const row = "#s7-row" + n;
            tl.fromTo(row, { x: 640 }, { x: 0, duration: 0.34, ease: "power3.out" }, t0);
            tl.fromTo(row, { y: -70 }, { y: 0, duration: 0.34, ease: "back.out(1.6)" }, t0);
            tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, t0);
            tl.fromTo("#s7-rk" + n, { yPercent: 110 }, { yPercent: 0, duration: 0.28, ease: "back.out(1.4)" }, L - 0.04);
            tl.fromTo("#s7-sw" + n, { xPercent: -120 }, { xPercent: 400, duration: 0.6, ease: "power2.inOut" }, L);
            tl.fromTo("#s7-fl" + n, { width: "0%" }, { width: ((v / STARS[0]) * 100).toFixed(2) + "%", duration: 1.0, ease: "power3.out" }, L);
            const el = document.getElementById("s7-num" + n), o = { v: 0 };
            tl.to(o, { v, duration: 1.0, ease: "power3.out", onUpdate: () => { el.textContent = "+" + fmt(o.v); } }, L);
            beats(L + 1.0, A("luu") - 0.2).forEach((b) => pulse(el, b, 1.06));
          });

          // "nhanh hơn": chip pops, speed streaks run along every bar, a light band sweeps the board
          const tN = A("nhanh");
          tl.fromTo("#s7-chip", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, tN - 0.05);
          tl.fromTo("#s7-bolt", { opacity: 1 }, { opacity: 0.35, duration: 0.08, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, tN + 0.25);
          STARS.forEach((_, i) => {
            tl.fromTo("#s7-sk" + (i + 1), { xPercent: 0 }, { xPercent: 467, duration: 0.45, ease: "power2.in", immediateRender: false }, tN + 0.04 * i);
          });
          tl.fromTo("#s7-bsw", { y: -160, opacity: 0.1 }, { y: 600, duration: 0.55, ease: "power2.inOut", immediateRender: false }, tN);
          tl.to("#s7-bsw", { opacity: 0, duration: 0.15, ease: "none" }, tN + 0.4);
          beats(tN + 0.35, A("luu") - 0.2).forEach((b) => pulse("#s7-chip", b, 1.04));

          // weekly total (8.319 + 7.084 + 6.566 + 4.003 + 2.601 = 28.573), the scene's key number in accent
          const tT = nextHB(tN + 0.1);
          tl.fromTo("#s7-tline", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, tT - 0.1);
          tl.fromTo("#s7-tlab", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power2.out" }, tT - 0.05);
          tl.fromTo("#s7-tst", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, tT);
          const tEl = document.getElementById("s7-tnum"), tO = { v: 0 };
          tl.to(tO, { v: 28573, duration: 1.0, ease: "power3.out", onUpdate: () => { tEl.textContent = "+" + fmt(tO.v); } }, tT);
          beats(tT + 0.7, A("luu") - 0.1).forEach((b) => pulse(tEl, b, 1.06));

          // ---------- Sentence 2: "Lưu video lại và thử ngay một repo hợp với công việc của bạn" ----------
          const tL = A("luu");
          // whip: the board block snaps up to make room for the CTA, with a short motion blur
          tl.fromTo("#s7-main", { y: 170 }, { y: 0, duration: 0.34, ease: "power4.inOut" }, tL - 0.17);
          tl.fromTo("#s7-cam", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.15, ease: "power2.in", immediateRender: false }, tL - 0.17);
          tl.to("#s7-cam", { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, tL - 0.02);
          // accent hands over from the total to the call to action (one accent at a time)
          tl.fromTo("#s7-tnum", { color: ACC, textShadow: "0px 0px 28px " + GLOW }, { color: INK, textShadow: "0px 0px 0px rgba(0, 0, 0, 0)", duration: 0.3, ease: "power2.out", immediateRender: false }, tL - 0.02);

          tl.fromTo("#s7-save", { scale: 0.6, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.34, ease: "back.out(1.6)" }, tL);
          tl.fromTo("#s7-ssw", { xPercent: -120 }, { xPercent: 400, duration: 0.7, ease: "power2.inOut" }, tL + 0.15);
          tl.fromTo("#s7-conn", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, tL + 0.1);
          [tL + 0.2].concat(beats(tL + 0.8, HOLD - 0.5).filter((_, k) => k % 2 === 0)).forEach((t) => {
            tl.fromTo("#s7-cdot", { y: 0, opacity: 1 }, { y: 54, duration: 0.32, ease: "power1.in", immediateRender: false }, t);
            tl.to("#s7-cdot", { opacity: 0, duration: 0.06, ease: "none" }, t + 0.3);
          });
          // bookmark icon ticks on every beat
          beats(tL + 0.3, HOLD - 0.25).forEach((b) => pulse("#s7-bm", b, 1.14));

          // cursor flies in on a curve and presses LƯU VIDEO ("video")
          const c1 = nextHB(tL + 0.55);
          tl.set("#s7-cur", { x: 1010, y: 1600, opacity: 0, transformOrigin: "3px 3px" }, 0);
          tl.to("#s7-cur", { opacity: 1, duration: 0.15, ease: "none" }, c1 - 0.47);
          tl.to("#s7-cur", { x: 757, duration: 0.42, ease: "power2.out" }, c1 - 0.47);
          tl.to("#s7-cur", { y: 1317, duration: 0.42, ease: "power3.inOut" }, c1 - 0.47);
          tl.to("#s7-cur", { scale: 0.82, duration: 0.07, ease: "power2.in" }, c1 - 0.05);
          tl.to("#s7-cur", { scale: 1, duration: 0.18, ease: "back.out(2)" }, c1 + 0.02);
          tl.to("#s7-save", { scale: 0.965, duration: 0.07, ease: "power2.in" }, c1 - 0.04);
          tl.to("#s7-save", { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, c1 + 0.03);
          tl.fromTo("#s7-rip1", { scale: 0, opacity: 0.3 }, { scale: 5, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, c1);
          tl.fromTo("#s7-bmf", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)", immediateRender: false }, c1 + 0.02);

          // THỬ NGAY slides in ("thử ngay"), cursor presses it
          const tY = A("thu");
          tl.fromTo("#s7-try", { x: 320, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "back.out(1.4)" }, tY - 0.06);
          const c2 = nextHB(tY + 0.3);
          tl.to("#s7-cur", { x: 697, duration: 0.38, ease: "power2.inOut" }, c2 - 0.43);
          tl.to("#s7-cur", { y: 1475, duration: 0.38, ease: "back.out(1.2)" }, c2 - 0.43);
          tl.to("#s7-cur", { scale: 0.82, duration: 0.07, ease: "power2.in" }, c2 - 0.05);
          tl.to("#s7-cur", { scale: 1, duration: 0.18, ease: "back.out(2)" }, c2 + 0.02);
          tl.to("#s7-try", { scale: 0.96, duration: 0.07, ease: "power2.in" }, c2 - 0.04);
          tl.to("#s7-try", { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, c2 + 0.03);
          tl.fromTo("#s7-rip2", { scale: 0, opacity: 0.22 }, { scale: 5, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, c2);
          tl.fromTo("#s7-arr", { x: 0 }, { x: 12, duration: 0.12, yoyo: true, repeat: 3, ease: "power1.inOut", immediateRender: false }, c2 + 0.05);
          tl.to("#s7-cur", { x: "-=14", y: "-=10", duration: 0.45, ease: "sine.inOut" }, c2 + 0.35);

          // "một repo hợp với công việc": chip flips to CHỌN 1 REPO, cursor hovers the rows with a selection ring
          const tC = A("cv");
          tl.fromTo("#s7-f1", { yPercent: 0 }, { yPercent: -110, duration: 0.28, ease: "power3.in", immediateRender: false }, tC - 0.05);
          tl.fromTo("#s7-f2", { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "back.out(1.4)" }, tC + 0.1);
          const order = [4, 3, 2, 1, 2];
          const hops = halfBeats(tC + 0.05, HOLD).slice(0, order.length);
          const rowY = (r) => r * 144;
          const curY = (r) => 392 + r * 144 + 59;
          tl.to("#s7-cur", { x: 897, duration: 0.3, ease: "power2.out" }, hops[0] - 0.32);
          tl.to("#s7-cur", { y: curY(order[0]), duration: 0.3, ease: "power3.inOut" }, hops[0] - 0.32);
          tl.fromTo("#s7-ring", { y: rowY(order[0]), opacity: 0, scale: 1.04 }, { y: rowY(order[0]), opacity: 1, scale: 1, duration: 0.24, ease: "back.out(1.6)" }, hops[0] - 0.04);
          tl.fromTo("#s7-sk" + (order[0] + 1), { xPercent: 0 }, { xPercent: 467, duration: 0.35, ease: "power2.in", immediateRender: false }, hops[0]);
          for (let k = 1; k < order.length; k++) {
            tl.to("#s7-ring", { y: rowY(order[k]), duration: 0.22, ease: "back.out(1.5)" }, hops[k] - 0.1);
            tl.to("#s7-cur", { x: 880 + (k % 2) * 24, y: curY(order[k]), duration: 0.24, ease: "power3.out" }, hops[k] - 0.12);
            tl.fromTo("#s7-sk" + (order[k] + 1), { xPercent: 0 }, { xPercent: 467, duration: 0.28, ease: "power2.in", immediateRender: false }, hops[k] - 0.05);
          }

          // pad the timeline to the scene length; the last 0.3 s is a stable hold (final scene, no CRT-off)
          tl.set({}, {}, END);
          window.__timelines["s7"] = tl;
        })();
      </script>
    </template>
  </body>
