      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s6", key);
          const tl = gsap.timeline({ paused: true });
          const SC = window.__vv.scenes["s6"];
          const S = SC.start, DUR = SC.end - SC.start;
          const BEAT = 60 / 104, HB = BEAT / 2;
          const halves = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / HB - 1e-9); k * HB - S <= to; k++) o.push(k * HB - S); return o; };
          // snap a layer start to the nearest half beat when it is close enough
          const grid = (t, tol = 0.1) => { const g = Math.round((S + t) / HB) * HB - S; return Math.abs(g - t) <= tol ? g : t; };
          const q = (s) => document.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          const f2 = (v) => (+v).toFixed(2);
          const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

          // ---------- helpers: glowing nib, draw-on, write-on ----------
          const nibFade = (n, t, d) => {
            tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t);
            tl.to(n, { opacity: 0, duration: 0.1, ease: "none" }, t + d);
          };
          const mkNib = (parent, x, y) => svgEl("circle", { class: "s6-nib", r: 4, cx: f2(x), cy: f2(y) }, parent);
          const fillIn = (el, t, d) => {
            if (el.hasAttribute("fill-opacity")) tl.fromTo(el, { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": 1 }, duration: Math.min(0.15, d), ease: "none" }, t);
          };
          const nibTrack = (el, L, t, d, ease, parent) => {
            const p0 = el.getPointAtLength(0), n = mkNib(parent || el.parentNode, p0.x, p0.y), pr = { p: 0 };
            tl.fromTo(pr, { p: 0 }, { p: 1, duration: d, ease, onUpdate: () => {
              const pt = el.getPointAtLength(L * pr.p); n.setAttribute("cx", f2(pt.x)); n.setAttribute("cy", f2(pt.y));
            } }, t);
            nibFade(n, t, d);
          };
          // solid stroke: strokeDashoffset from length to 0 (paper fill first, then the outline)
          const draw = (sel, t, d, o = {}) => {
            const el = typeof sel === "string" ? q(sel) : sel;
            const L = el.getTotalLength(), ease = o.ease || "power1.inOut";
            el.style.strokeDasharray = L + " " + (L + 4);
            fillIn(el, t, d);
            tl.fromTo(el, { strokeDashoffset: L + 2 }, { strokeDashoffset: 0, duration: d, ease }, t);
            if (o.nib !== false) nibTrack(el, L, t, d, ease, o.nibIn);
          };
          // stroke whose shape keeps changing after it is drawn (compass legs): oversized dash, then fully on
          const drawGrow = (sel, t, d) => {
            const el = q(sel), L = el.getTotalLength(), B = 3000;
            el.style.strokeDasharray = B + " " + (B + 4);
            fillIn(el, t, d);
            tl.fromTo(el, { strokeDashoffset: B + 2 }, { strokeDashoffset: B - L, duration: d, ease: "power1.inOut" }, t);
            tl.set(el, { strokeDashoffset: 0 }, t + d + 0.01);
            nibTrack(el, L, t, d, "power1.inOut");
          };
          // dashed straight line (centre / hidden): grow the end point, the dash pattern stays put
          const drawLine = (sel, t, d, nib = true) => {
            const el = q(sel);
            const x1 = +el.getAttribute("x1"), y1 = +el.getAttribute("y1"), x2 = +el.getAttribute("x2"), y2 = +el.getAttribute("y2");
            const n = nib ? mkNib(el.parentNode, x1, y1) : null;
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t);
            tl.fromTo(el, { attr: { x2: x1, y2: y1 } }, { attr: { x2, y2 }, duration: d, ease: "power1.inOut",
              onUpdate: n ? () => { n.setAttribute("cx", el.getAttribute("x2")); n.setAttribute("cy", el.getAttribute("y2")); } : undefined }, t);
            if (n) nibFade(n, t, d);
          };
          // text lettered on left to right with a glowing nib at the edge
          const write = (sel, t, d = 0.4, nib = true) => {
            const el = q(sel);
            tl.fromTo(el, { clipPath: "inset(-30% 100% -30% 0)" }, { clipPath: "inset(-30% 0% -30% 0)", duration: d, ease: "power1.inOut" }, t);
            if (!nib) return;
            const n = document.createElement("div"); n.className = "s6-tnib"; el.parentNode.appendChild(n);
            const pr = { p: 0 };
            tl.fromTo(pr, { p: 0 }, { p: 1, duration: d, ease: "power1.inOut", onUpdate: () => {
              const x = el.offsetLeft + el.offsetWidth * pr.p - 4, y = el.offsetTop + el.offsetHeight * 0.6 - 4;
              n.style.transform = "translate(" + f2(x) + "px," + f2(y) + "px)";
            } }, t);
            nibFade(n, t, d);
          };
          const pop = (sel, t, d = 0.35) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: d, ease: "back.out(1.6)" }, t);

          // ---------- geometry built once (deterministic) ----------
          // spur gear outline: same module m so the teeth really mesh; tooth i centred at phase + i*pitch
          const gearD = (cx, cy, N, m, phase) => {
            const r = (m * N) / 2, ra = r + m, rf = r - 1.25 * m, p = (2 * Math.PI) / N;
            const P = (rad, a) => f2(cx + rad * Math.cos(a)) + " " + f2(cy + rad * Math.sin(a));
            let d = "";
            for (let i = 0; i < N; i++) {
              const c = phase + i * p;
              d += (i ? "L" : "M") + P(rf, c - 0.3 * p) + "L" + P(ra, c - 0.13 * p) + "A" + ra + " " + ra + " 0 0 1 " + P(ra, c + 0.13 * p) +
                "L" + P(rf, c + 0.3 * p) + "A" + rf + " " + rf + " 0 0 1 " + P(rf, c + 0.7 * p);
            }
            return d + "Z";
          };
          const NA = 12, NB = 8, MOD = 16;                       // r_A 96 + r_B 64 = centre distance 160
          q("#s6-gAp").setAttribute("d", gearD(215, 1310, NA, MOD, 0));                 // tooth points at gear B
          q("#s6-gBp").setAttribute("d", gearD(375, 1310, NB, MOD, Math.PI / NB));      // gap faces gear A
          gsap.set("#s6-gA", { svgOrigin: "215 1310", rotation: 0 });
          gsap.set("#s6-gB", { svgOrigin: "375 1310", rotation: 0 });

          // 45 degree section hatching inside the base plate (x 110..480, y 1468..1494), spacing 12
          const hatchG = q("#s6-hatch"), hatch = [];
          for (let x0 = 110 - 26; x0 <= 480; x0 += 12) {
            const t0 = Math.max(0, 110 - x0), t1 = Math.min(26, 480 - x0);
            if (t1 - t0 < 3) continue;
            hatch.push(svgEl("line", { class: "s6-h", x1: f2(x0 + t0), y1: f2(1494 - t0), x2: f2(x0 + t1), y2: f2(1494 - t1) }, hatchG));
          }

          // impact rays around the stamp (skip the right side, it runs into the sheet edge)
          const raysG = q("#s6-rays"), rays = [];
          [200, 235, 270, 305, 160, 125, 90, 55].forEach((deg) => {
            const a = (deg * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
            const el = svgEl("line", { class: "s6-t s6-ray", x1: f2(785 + c * 226), y1: f2(762 + s * 126), x2: f2(785 + c * 258), y2: f2(762 + s * 146) }, raysG);
            rays.push({ el, dx: c * 18, dy: s * 12 });
          });

          // compasses: needle fixed at C, pencil on the arc, hinge above the midpoint (oblique height)
          const C = [670, 1395], RAD = 170, HGT = 165;
          const PHI0 = (-50 * Math.PI) / 180, PHI1 = (50 * Math.PI) / 180;
          const legPoly = (el, H, T, w0, w1, tip) => {
            const dx = T[0] - H[0], dy = T[1] - H[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
            const Q = [T[0] - ux * tip, T[1] - uy * tip];
            const pts = [[H[0] + nx * w0, H[1] + ny * w0], [Q[0] + nx * w1, Q[1] + ny * w1], T, [Q[0] - nx * w1, Q[1] - ny * w1], [H[0] - nx * w0, H[1] - ny * w0]];
            el.setAttribute("points", pts.map((p) => f2(p[0]) + "," + f2(p[1])).join(" "));
          };
          const elN = q("#s6-cn"), elP = q("#s6-cpn"), elHd = q("#s6-chd");
          const setCompass = (phi) => {
            const P = [C[0] + RAD * Math.cos(phi), C[1] + RAD * Math.sin(phi)];
            const H = [(C[0] + P[0]) / 2, (C[1] + P[1]) / 2 - HGT];
            legPoly(elN, H, C, 7, 3, 18);
            legPoly(elP, H, P, 7, 4.5, 26);
            elHd.setAttribute("transform", "translate(" + f2(H[0]) + " " + f2(H[1]) + ")");
          };
          setCompass(PHI0);

          // ---------- camera: lateral pan in, slow push, pan out ----------
          tl.fromTo("#s6-stage", { x: 220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#s6-cam", { scale: 1, transformOrigin: "50% 40%" }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

          // ---------- figure title ----------
          write("#s6-title", 0.06, 0.45);
          draw("#s6-tul", 0.2, 0.4);

          // ---------- Sentence 1: "Kỹ sư vẫn là người duyệt cuối cùng, ký tên và chịu trách nhiệm" ----------
          // layer 1 (outline): title block frame on "Kỹ sư"
          const tTB = grid(A("ks"), 0.15);
          draw("#s6-tb", tTB, 0.75);
          // layer 2 (detail): row rules on the half beat before "duyệt"
          const tR = grid(A("duyet") - 0.1);
          ["#s6-r1", "#s6-v0", "#s6-r2", "#s6-r3", "#s6-v1", "#s6-r4"].forEach((s, i) => draw(s, tR + i * 0.06, 0.32));
          // labels last: sheet header, sheet code, then THIET KE / KIEM TRA / PHE DUYET / NGAY
          write("#s6-hdr", tR + 0.02, 0.45);
          write("#s6-code", tR + 0.28, 0.3);
          ["#s6-l1", "#s6-l2", "#s6-l3", "#s6-l4"].forEach((s, i) => write(s, A("duyet") + 0.06 + i * 0.07, 0.35));
          // "duyệt cuối cùng": brackets close on the approval row
          tl.fromTo("#s6-focus", { scale: 1.08, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 0.85, duration: 0.3, ease: "power2.out" }, A("duyet") + 0.3);
          // designer and checker fields already filled by the agent, ticked
          write("#s6-v1t", A("duyet") + 0.32, 0.3, false);
          write("#s6-v2t", A("duyet") + 0.42, 0.3, false);
          draw("#s6-tk1", A("duyet") + 0.45, 0.18);
          draw("#s6-tk2", A("duyet") + 0.57, 0.18);
          write("#s6-ks", A("ky") - 0.1, 0.3, false);
          // "ký tên": the signature is written in the approval field
          const tSig = A("ky") + 0.08;
          draw("#s6-sig", tSig, 0.6);
          write("#s6-date", tSig + 0.3, 0.35, false);

          // "chịu trách nhiệm": the red stamp slams down on the beat, frame jolts once
          const tImp = grid(A("tn") + 0.1);
          tl.fromTo("#s6-stamp", { scale: 1.7, rotation: -15, y: -30, opacity: 0, transformOrigin: "50% 50%" },
            { scale: 1, rotation: -8, y: 0, opacity: 1, duration: 0.14, ease: "power4.in" }, tImp - 0.14);
          tl.to("#s6-stamp", { keyframes: [{ scale: 0.965, duration: 0.05, ease: "power2.out" }, { scale: 1.012, duration: 0.08 }, { scale: 1, duration: 0.1 }] }, tImp);
          tl.fromTo("#s6-stamp-bleed", { opacity: 0 }, { opacity: 0.5, duration: 0.8, ease: "power2.out" }, tImp + 0.02);
          tl.to("#s6-shake", { keyframes: [{ x: -9, y: 6, duration: 0.05 }, { x: 7, y: -4, duration: 0.06 }, { x: -4, y: 3, duration: 0.06 }, { x: 2, y: -1, duration: 0.07 }, { x: 0, y: 0, duration: 0.08 }], ease: "none" }, tImp);
          rays.forEach((r) => {
            tl.fromTo(r.el, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, tImp);
            tl.fromTo(r.el, { x: 0, y: 0 }, { x: r.dx, y: r.dy, duration: 0.35, ease: "power2.out" }, tImp);
            tl.to(r.el, { opacity: 0, duration: 0.28, ease: "power1.in" }, tImp + 0.06);
          });
          tl.to("#s6-focus", { opacity: 0.35, duration: 0.3, ease: "power1.out" }, tImp + 0.05);
          // balloon "6" calls out the verdict while the ink settles
          const tBal = grid(A("tn") + 0.62);
          pop("#s6-ldd", tBal - 0.04, 0.2);
          draw("#s6-ld", tBal, 0.22);
          pop("#s6-bal", tBal + 0.18, 0.35);

          // ---------- Sentence 2: "AI làm phần lặp lại, con người giữ phần phán đoán" ----------
          // split the lower half: hair rule from the centre outward, centre-line divider down
          const tSp = grid(A("ai") - 0.85);
          draw("#s6-sh1", tSp, 0.4);
          draw("#s6-sh2", tSp, 0.4);
          drawLine("#s6-dv", tSp + 0.06, 0.5);

          // LEFT: "AI: PHẦN LẶP LẠI" with gears
          write("#s6-pl1", A("ai") - 0.5, 0.3);
          write("#s6-pl2", A("ai") + 0.1, 0.45);
          const tCL = grid(A("ai") - 0.55);                              // centre lines
          drawLine("#s6-cAx", tCL, 0.35);
          drawLine("#s6-cAy", tCL + 0.06, 0.3);
          drawLine("#s6-cBy", tCL + 0.12, 0.28);
          draw("#s6-mAc", tCL + 0.16, 0.4, { nibIn: q("#s6-pg") });       // pitch circles
          draw("#s6-mBc", tCL + 0.22, 0.34, { nibIn: q("#s6-pg") });
          const tG = grid(A("ai") - 0.3);                                // outlines
          draw("#s6-gAp", tG, 0.55);
          draw("#s6-gBp", tG + 0.1, 0.45);
          const tDet = grid(A("ai"));                                    // details
          ["#s6-gAhub", "#s6-gBhub"].forEach((s, i) => draw(s, tDet + i * 0.05, 0.2));
          ["#s6-gAh1", "#s6-gAh2", "#s6-gAh3", "#s6-gAh4", "#s6-gBh1", "#s6-gBh2", "#s6-gBh3", "#s6-gBh4", "#s6-gAk", "#s6-gBk"]
            .forEach((s, i) => draw(s, tDet + 0.04 + i * 0.025, 0.14, { nib: false }));
          pop("#s6-sA", tDet + 0.08, 0.25);
          pop("#s6-sB", tDet + 0.12, 0.25);
          draw("#s6-bp", tDet + 0.02, 0.3);
          drawLine("#s6-hA", tDet + 0.12, 0.22, false);
          drawLine("#s6-hB", tDet + 0.16, 0.2, false);
          hatch.forEach((h, i) => draw(h, tDet + 0.2 + i * 0.016, 0.1, { nib: false }));   // hatching sweeps across

          // escapement: one tooth per half beat, short ease-out; ratio NA/NB keeps the mesh exact
          const stepA = 360 / NA, stepB = 360 / NB;
          const steps = halves(A("ai") + 0.23, DUR - 0.32);
          const tallyG = q("#s6-tally");
          steps.forEach((t, i) => {
            tl.fromTo("#s6-gA", { rotation: i * stepA }, { rotation: (i + 1) * stepA, svgOrigin: "215 1310", duration: 0.17, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo("#s6-gB", { rotation: -i * stepB }, { rotation: -(i + 1) * stepB, svgOrigin: "375 1310", duration: 0.17, ease: "power3.out", immediateRender: false }, t);
            // spark at the pitch point on every tick
            tl.fromTo("#s6-spk", { opacity: 0, attr: { r: 4 } }, { opacity: 0.95, duration: 0.02, ease: "none", immediateRender: false }, t);
            tl.to("#s6-spk", { opacity: 0, attr: { r: 16 }, duration: 0.24, ease: "power2.out" }, t + 0.02);
            // tally of repetitions: four strokes, then the fifth strikes them through
            const g = Math.floor(i / 5), j = i % 5, bx = 130 + g * 100;
            const mark = j < 4
              ? svgEl("line", { class: "s6-d", x1: bx + j * 18, y1: 1514, x2: bx + j * 18, y2: 1550 }, tallyG)
              : svgEl("line", { class: "s6-d", x1: bx - 8, y1: 1546, x2: bx + 64, y2: 1518 }, tallyG);
            draw(mark, t, 0.09, { nib: false, ease: "power2.out" });
          });

          // RIGHT: "CON NGƯỜI: PHÁN ĐOÁN" with compasses swinging one arc
          write("#s6-pr1", A("nguoi") + 0.03, 0.35);
          write("#s6-pr2", A("pd") + 0.08, 0.4);
          const tK = grid(A("nguoi"));
          drawLine("#s6-kx", tK, 0.22);
          drawLine("#s6-ky", tK + 0.04, 0.22);
          pop("#s6-cpv", tK + 0.02, 0.22);
          drawGrow("#s6-cn", tK + 0.08, 0.28);
          drawGrow("#s6-cpn", tK + 0.16, 0.28);
          draw("#s6-chr", tK + 0.36, 0.18);
          draw("#s6-chc", tK + 0.4, 0.16);
          tl.fromTo("#s6-ck", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, tK + 0.5);
          pop("#s6-chp", tK + 0.5, 0.2);
          // the arc: pencil tip and drawn line share one tween timing so they stay together
          const tArc = grid(A("pd")), dArc = 0.5;
          draw("#s6-arc", tArc, dArc);
          const cp = { phi: PHI0 };
          tl.fromTo(cp, { phi: PHI0 }, { phi: PHI1, duration: dArc, ease: "power1.inOut", onUpdate: () => setCompass(cp.phi) }, tArc);
          // radius dimension once the pencil has passed it
          draw("#s6-rd", tArc + 0.3, 0.15);
          tl.fromTo("#s6-ra", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, tArc + 0.43);
          write("#s6-rl", tArc + 0.4, 0.15, false);

          // ---------- exit: pan on to the next figure ----------
          tl.to("#s6-stage", { x: -220, opacity: 0, duration: 0.3, ease: "power2.in" }, DUR - 0.3);

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
