      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s6", key);
          const SC = window.__vv.scenes["s6"];
          const S = SC.start, DUR = SC.end - SC.start;
          const BEAT = 60 / 92;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          const $ = (n) => document.getElementById("s6-" + n);
          const root = $("root");
          const stage = $("stage");
          const PEN = $("pen");
          const tl = gsap.timeline({ paused: true });

          // ---------- zig-zag hatching (boustrophedon, deterministic) ----------
          function hatchD(x, y, w, h, s, dir) {
            let d = "", k = 0;
            for (let c = s * 0.5; c < w + h; c += s, k++) {
              const a1 = Math.max(0, c - h), a2 = Math.min(w, c);
              const p1 = [x + a1, y + c - a1], p2 = [x + a2, y + c - a2];
              if (dir < 0) { p1[0] = 2 * x + w - p1[0]; p2[0] = 2 * x + w - p2[0]; }
              const P = k % 2 ? p2 : p1, Q = k % 2 ? p1 : p2;
              d += (k ? " L" : "M") + P[0].toFixed(1) + " " + P[1].toFixed(1) + " L" + Q[0].toFixed(1) + " " + Q[1].toFixed(1);
            }
            return d;
          }
          root.querySelectorAll("[data-h]").forEach((el) => {
            const v = el.getAttribute("data-h").split(" ").map(Number);
            el.setAttribute("d", hatchD(v[0], v[1], v[2], v[3], v[4], v[5]));
          });

          // ---------- crayon draw-on (12 fps nicks), optional guiding crayon ----------
          function draw(el, t, dur, steps = 8, pen = false) {
            const L = el.getTotalLength(), off = L + 30;
            el.style.strokeDasharray = off + " " + (L + 60);
            // hidden until its stroke starts (round caps + wobble filter leaked specks before)
            gsap.set(el, { opacity: 0 });
            tl.set(el, { opacity: 1 }, t);
            tl.fromTo(el, { strokeDashoffset: off }, { strokeDashoffset: 0, duration: dur, ease: "steps(" + steps + ")" }, t);
            if (pen) {
              for (let i = 0; i <= steps; i++) {
                const p = el.getPointAtLength(Math.min(L, off * i / steps));
                tl.set(PEN, { x: p.x, y: p.y }, t + dur * i / steps);
              }
            }
          }

          // ---------- hand-lettered words: per-letter tilt by index formula ----------
          function letters(el) {
            const s = el.textContent.trim().normalize("NFC");
            el.textContent = "";
            return Array.from(s).map((ch, i) => {
              const sp = document.createElement("span"); sp.setAttribute("data-layout-allow-overlap", "");
              sp.textContent = ch === " " ? " " : ch;
              el.appendChild(sp);
              const base = (i * 53 + 7) % 4;
              gsap.set(sp, { rotation: ((i * 37 + 11) % 9) - 4, y: base });
              sp.dataset.by = base;
              return sp;
            });
          }
          function write(sps, t, dur = 0.35) { sps.forEach((sp, i) => tl.set(sp, { opacity: 1 }, t + i * dur / sps.length)); }

          const L_pn = letters($("pn")), L_xin = letters($("w-xin")), L_bad = letters($("w-bad")), L_good = letters($("w-good"));
          const L_nhip = letters($("l-nhip")), L_nguoi = letters($("l-nguoi")), L_hinh = letters($("l-hinh"));

          const tS = A("sua"), tN = A("nhip"), tP = A("nguoi"), tH = A("hinhve");

          // ---------- camera: page turn in, slow drift, page turn out ----------
          gsap.set(stage, { transformOrigin: "0% 50%" });
          tl.fromTo(stage, { rotation: 6, x: 260, opacity: 0 }, { rotation: 0, x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo(stage, { scale: 1, y: 0 }, { scale: 1.04, y: -14, duration: DUR, ease: "none" }, 0);

          // ---------- boil: re-seed noise every 2 frames at 24 fps ----------
          const turbs = root.querySelectorAll(".s6-turb"), grains = root.querySelectorAll(".s6-grain");
          for (let t = 0, k = 0; t < DUR; t += 1 / 6, k++) {
            tl.set(turbs, { attr: { seed: 1 + (k % 5) } }, t);
            if (k % 2 === 0) tl.set(grains, { attr: { seed: 3 + ((k / 2) % 4) * 5 } }, t);
          }

          // ---------- beat 1: "Bạn sửa được từng chữ" (eraser fixes a word) ----------
          draw($("card-o"), 0.05, 0.4, 8);
          draw($("card-h"), 0.12, 0.45, 8);
          draw($("card-x"), 0.3, 0.35, 6);
          draw($("pn-ring"), 0.15, 0.35, 6);
          write(L_pn, 0.4, 0.1);
          write(L_xin, 0.06, 0.2);
          write(L_bad, tS - 0.22, 0.2);

          const ER = $("eraser");
          gsap.set(ER, { transformOrigin: "50% 50%" });
          tl.set(ER, { opacity: 1 }, tS - 0.12);
          tl.fromTo(ER, { x: 1180, y: 240, rotation: 12 }, { x: 430, y: 355, rotation: -12, duration: 0.16, ease: "steps(3)" }, tS - 0.12);
          const r0 = tS + 0.06, rN = 8, rD = 0.6;
          for (let k = 1; k <= rN; k++) {
            const p = k / rN;
            tl.set(ER, { x: 430 + p * 210 + (k % 2 ? 16 : -16), y: 355 + (k % 2 ? -5 : 5), rotation: -12 + (k % 2 ? 6 : -6) }, r0 + k * rD / rN);
          }
          tl.fromTo($("w-bad"), { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: rD, ease: "steps(8)" }, r0);
          const crumbs = root.querySelectorAll(".s6-crumb");
          crumbs.forEach((c, i) => tl.set(c, { opacity: 1 }, r0 + (i + 1) * 0.085));
          tl.to(crumbs, { y: 40, duration: 0.15, ease: "steps(3)" }, tS + 0.74);
          tl.to(ER, { x: 1180, y: 180, rotation: 15, duration: 0.18, ease: "steps(3)" }, tS + 0.7);
          write(L_good, tS + 0.62, 0.32);
          draw($("under"), tS + 0.8, 0.3, 6);
          draw($("tick"), tS + 0.95, 0.2, 4);

          // ---------- beat 2: "từng nhịp" (rhythm slider) ----------
          write(L_nhip, tN - 0.05, 0.3);
          draw($("track-o"), tN, 0.4, 8);
          draw($("ticks"), tN + 0.15, 0.3, 7);
          const KN = $("knob");
          gsap.set(KN, { transformOrigin: "50% 50%" });
          tl.set(KN, { opacity: 1 }, tN + 0.35);
          tl.fromTo(KN, { scale: 0 }, { scale: 1, duration: 0.12, ease: "steps(3)" }, tN + 0.35);
          tl.fromTo(KN, { x: 0 }, { x: 408, duration: 0.45, ease: "steps(6)" }, tN + 0.42);
          draw($("track-h"), tN + 0.42, 0.45, 6);
          tl.to(KN, { x: 372, duration: 0.1, ease: "steps(2)" }, tN + 1.0);
          tl.to(KN, { x: 408, duration: 0.1, ease: "steps(2)" }, tN + 1.2);
          const notes = [$("note0"), $("note1"), $("note2")];
          notes.forEach((n, i) => tl.set(n, { opacity: 1 }, tN + 0.5 + i * 0.1));
          beats(tN + 0.55, DUR - 0.35).forEach((b) => {
            notes.forEach((n, i) => {
              tl.set(n, { y: -14 }, b + i * 0.08);
              tl.set(n, { y: 0 }, b + i * 0.08 + 0.17);
            });
          });

          // ---------- beat 3: "Không có người thật do máy tạo ra" (photo crossed out) ----------
          draw($("frame-o"), tP - 0.26, 0.35, 8);
          draw($("frame-h"), tP - 0.15, 0.4, 8);
          draw($("frame-x"), tP, 0.3, 6);
          tl.set($("tape0"), { opacity: 1 }, tP + 0.05);
          tl.set($("tape1"), { opacity: 1 }, tP + 0.1);
          draw($("head-o"), tP, 0.3, 8);
          draw($("shoul-o"), tP + 0.1, 0.3, 8);
          draw($("sil-h"), tP + 0.15, 0.4, 8);
          draw($("sil-x"), tP + 0.3, 0.3, 6);
          write(L_nguoi, tP + 0.12, 0.35);

          gsap.set(PEN, { x: 1150, y: 1250 });
          tl.set(PEN, { opacity: 1 }, tP + 0.42);
          tl.fromTo(PEN, { x: 1150, y: 1250 }, { x: 150, y: 905, duration: 0.08, ease: "steps(2)", immediateRender: false }, tP + 0.42);
          draw($("x1"), tP + 0.5, 0.22, 6, true);
          tl.set(PEN, { x: 478, y: 905 }, tP + 0.74);
          draw($("x2"), tP + 0.76, 0.22, 6, true);
          tl.set(PEN, { y: 1326 }, tP + 0.99);
          tl.set(PEN, { y: 1338 }, tP + 1.03);
          tl.to(PEN, { x: 1150, y: 1500, duration: 0.15, ease: "steps(3)" }, tP + 1.06);
          tl.set(PEN, { opacity: 0 }, tP + 1.22);
          draw($("strike"), tP + 1.08, 0.2, 4);
          const PH = $("photo");
          gsap.set(PH, { transformOrigin: "50% 50%" });
          [[1.15, 1.6], [1.27, -1.4], [1.39, 1.0], [1.5, 0]].forEach(([dt, r]) => tl.set(PH, { rotation: r }, tP + dt));

          // ---------- beat 4: "chỉ có hình vẽ biết cử động" (stick figure waves) ----------
          draw($("arrow"), tH - 0.38, 0.25, 6);
          draw($("arrowhead"), tH - 0.14, 0.1, 3);
          write(L_hinh, tH + 0.1, 0.3);

          tl.set(PEN, { opacity: 1 }, tH - 0.2);
          tl.fromTo(PEN, { x: 1150, y: 1400 }, { x: 830, y: 985, duration: 0.1, ease: "steps(2)", immediateRender: false }, tH - 0.2);
          draw($("kidhead"), tH - 0.08, 0.25, 8, true);
          draw($("body"), tH + 0.18, 0.12, 4, true);
          tl.to(PEN, { x: 1150, y: 1500, duration: 0.15, ease: "steps(3)" }, tH + 0.32);
          tl.set(PEN, { opacity: 0 }, tH + 0.48);
          draw($("hair"), tH + 0.15, 0.1, 3);
          tl.set($("face"), { opacity: 1 }, tH + 0.2);
          draw($("smile"), tH + 0.22, 0.12, 3);
          draw($("dress-o"), tH + 0.3, 0.18, 5);
          draw($("legs"), tH + 0.28, 0.14, 4);
          draw($("armL"), tH + 0.34, 0.12, 3);
          draw($("armA-p"), tH + 0.36, 0.12, 3);
          tl.set($("mitL"), { opacity: 1 }, tH + 0.47);
          tl.set($("mitA"), { opacity: 1 }, tH + 0.49);
          draw($("dress-h"), tH + 0.42, 0.35, 8);

          // waving: two key drawings alternate (substitution)
          const armA = $("armA"), armB = $("armB"), wl = $("wl");
          for (let t = tH + 0.68, k = 0; t < DUR - 0.45; t += 0.22, k++) {
            const up = k % 2 === 0;
            tl.set(armA, { opacity: up ? 0 : 1 }, t);
            tl.set(armB, { opacity: up ? 1 : 0 }, t);
            tl.set(wl, { opacity: up ? 1 : 0 }, t);
          }
          // whole figure hops on the beat
          const KID = $("kid");
          beats(tH + 0.6, DUR - 0.45).forEach((b) => {
            tl.set(KID, { y: -12 }, b);
            tl.set(KID, { y: 0 }, b + 0.12);
          });
          // label letters hop on "cử động"
          L_hinh.forEach((sp, i) => {
            const by = +sp.dataset.by;
            tl.set(sp, { y: by - 6 }, tH + 0.7 + i * 0.04);
            tl.set(sp, { y: by }, tH + 0.82 + i * 0.04);
          });
          // eye blink
          const EY = $("eyes");
          gsap.set(EY, { transformOrigin: "50% 50%" });
          tl.set(EY, { scaleY: 0.15 }, tH + 1.12);
          tl.set(EY, { scaleY: 1 }, tH + 1.2);
          // sparkles appear then pulse on beats
          const stars = [0, 1, 2, 3].map((i) => $("star" + i));
          stars.forEach((s, i) => {
            gsap.set(s, { transformOrigin: "50% 50%" });
            tl.set(s, { opacity: 1 }, tH + 0.2 + i * 0.1);
          });
          beats(tH + 0.4, DUR - 0.35).forEach((b, j) => {
            stars.forEach((s, i) => {
              if ((i + j) % 2 === 0) { tl.set(s, { scale: 1.35, rotation: 12 }, b); tl.set(s, { scale: 1, rotation: 0 }, b + 0.12); }
            });
          });

          // ---------- page turn out ----------
          tl.to(stage, { x: -240, rotation: -5, opacity: 0, duration: 0.3, ease: "power2.in" }, DUR - 0.3);

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
