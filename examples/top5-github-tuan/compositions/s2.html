      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s2", key);
          const SC = window.__vv.scenes["s2"];
          const DUR = SC.end - SC.start;
          const BEAT = 60 / 104, S = SC.start;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          // Deterministic hash in [0,1) (no Math.random).
          const hash = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7 + 1.3) * 43758.5453; return x - Math.floor(x); };
          // Vietnamese thousands separator: 160063 -> "160.063".
          const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          const q = (s) => document.querySelector(s);
          const qa = (s) => Array.from(document.querySelectorAll(s));
          const setTxt = (els, s) => els.forEach((el) => { el.textContent = s; });

          // ---------- build: 335 grey code lines ----------
          const LC = [
            "color-mix(in srgb, var(--ink3) 60%, transparent)",
            "color-mix(in srgb, var(--ink2) 30%, transparent)",
            "var(--s3)",
          ];
          let html = "";
          for (let i = 0; i < 335; i++) {
            let segs = "";
            if (hash(i, 9) > 0.1) {
              const n = 1 + Math.floor(hash(i, 2) * 3);
              for (let s = 0; s < n; s++) segs += '<b style="width:' + Math.round(28 + hash(i, 3 + s) * 150) + "px;background:" + LC[(i + s) % 3] + '"></b>';
            }
            html += '<div class="s2-ln"><i>' + (i + 1) + '</i><span style="padding-left:' + Math.floor(hash(i, 1) * 4) * 22 + 'px">' + segs + "</span></div>";
          }
          q("#s2-scroll").innerHTML = html;
          const LINE_H = 20, BODY_H = 820 - 64;
          const SCROLL_END = -(335 * LINE_H + 16 - BODY_H);

          // ---------- build: star-burst rays on an ellipse around the chip ----------
          let rays = "";
          for (let k = 0; k < 10; k++) {
            const a = (k / 10) * Math.PI * 2, rx = 210, ry = 66;
            const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
            const th = (Math.atan2(y / (ry * ry), x / (rx * rx)) * 180) / Math.PI;
            rays += '<i style="transform:translate(' + (x - 1.5).toFixed(1) + "px," + (y - 9).toFixed(1) + "px) rotate(" + (th - 90).toFixed(1) + 'deg)"></i>';
          }
          q("#s2-rays").innerHTML = rays;

          // ---------- build: data packets that run straight along the 48px grid ----------
          // _nen grid lines: x = 12 + 48k, y = 48m.
          const PK = 18, CV = ["--c1", "--c2", "--c3"], pk = [];
          let pkHtml = "";
          for (let i = 0; i < PK; i++) {
            const hz = hash(i, 1) < 0.55, dir = hash(i, 2) < 0.5 ? 1 : -1;
            const d = 6 + Math.floor(hash(i, 3) * 5), L = Math.round(70 + hash(i, 5) * 70);
            const col = "color-mix(in srgb, var(" + CV[i % 3] + ") 60%, var(--ink3))";
            const lx = hz ? 0 : 12 + 48 * (1 + Math.floor(hash(i, 4) * 20));
            const ly = hz ? 48 * (4 + Math.floor(hash(i, 4) * 30)) : 0;
            const rot = hz ? (dir > 0 ? 0 : 180) : dir > 0 ? 90 : -90;
            pkHtml +=
              '<div class="s2-pko" id="s2-pk' + i + '" style="left:' + lx + "px;top:" + ly + 'px">' +
              '<div class="s2-pki" style="width:' + L + "px;height:" + d + "px;left:" + (d / 2 - L) + "px;top:" + -d / 2 + "px;transform-origin:" + (L - d / 2) + "px " + d / 2 + "px;transform:rotate(" + rot + 'deg)">' +
              '<i style="right:' + d / 2 + "px;background:linear-gradient(90deg,transparent," + col + ')"></i>' +
              '<b style="width:' + d + "px;height:" + d + "px;background:" + col + ";box-shadow:0 0 12px " + col + '"></b></div></div>';
            pk.push({ hz, dir });
          }
          q("#s2-pk").innerHTML = pkHtml;
          q("#s2-pk").style.opacity = "0.6";

          const chipEls = qa("#s2-chipnum span");
          const p1Els = qa("#s2-pct1 span");
          const p2Els = qa("#s2-pct2 span");
          const totalEl = q("#s2-total");
          const linesEl = q("#s2-lines");

          const tl = gsap.timeline({ paused: true });
          const pulse = (t, sel, s) => {
            tl.to(sel, { scale: s || 1.04, duration: 0.08, ease: "power1.out" }, t);
            tl.to(sel, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.08);
          };
          const count = (t, to, dur, write, ease) => {
            const o = { v: 0 };
            tl.to(o, { v: to, duration: dur, ease: ease || "power3.out", onUpdate: () => write(o.v) }, t);
          };
          const typeOn = (sel, t, n, dur) => tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease: "steps(" + n + ")" }, t);

          const tH = A("hang"), tR = A("repo"), tS = A("sao"), tL = A("luat"), tI = A("it"), tC = A("code"), tT = A("token");
          const tE = DUR - 0.3;

          // ---------- camera + whip entrance ----------
          tl.fromTo("#s2-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s2-stage", { scale: 1.12, x: 90, opacity: 0, filter: "blur(8px)" }, { scale: 1, x: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#s2-env", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

          // ---------- layer 3: packets (straight runs, finite repeats) ----------
          pk.forEach((p, i) => {
            const dist = p.hz ? 1400 : 1940;
            const d = dist / (560 + hash(i, 6) * 380);
            const rd = 0.3 + hash(i, 7) * 1.4;
            const t0 = hash(i, 8) * 2.6;
            const n = Math.max(0, Math.floor((tE - t0 - d) / (d + rd)));
            const a = -160, b = p.hz ? 1240 : 1780;
            const from = p.dir > 0 ? a : b, to = p.dir > 0 ? b : a;
            const prop = p.hz ? "x" : "y";
            tl.fromTo("#s2-pk" + i, { [prop]: from }, { [prop]: to, duration: d, ease: "none", repeat: n, repeatDelay: rd }, t0);
          });

          // grid nodes blink on the beat (two per beat, rotating)
          const nodes = qa("#s2-env .s2-node");
          beats(0.45, tE - 0.1).forEach((t, j) => {
            [(j * 3) % 8, (j * 3 + 4) % 8].forEach((k) => {
              tl.to(nodes[k], { opacity: 0.95, scale: 1.5, duration: 0.08, ease: "power1.out" }, t);
              tl.to(nodes[k], { opacity: 0.35, scale: 1, duration: 0.3, ease: "power2.out" }, t + 0.08);
            });
          });

          // ---------- sentence 1: "#1" badge rises, repo card, star count ----------
          tl.fromTo("#s2-badge-in", { y: 310 }, { y: 0, duration: 0.42, ease: "back.out(1.3)" }, tH);
          tl.fromTo("#s2-glint", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.9, ease: "power2.inOut" }, tH + 0.3);
          typeOn("#s2-toplbl span", tH + 0.35, 11, 0.33);
          tl.fromTo("#s2-pips .s2-pip", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "back.out(1.4)", stagger: 0.05 }, tH + 0.45);
          beats(0.95, tL - 0.4).forEach((t) => {
            tl.to("#s2-pips .s2-on", { scaleY: 2, duration: 0.08, ease: "power1.out" }, t);
            tl.to("#s2-pips .s2-on", { scaleY: 1, duration: 0.22, ease: "power2.out" }, t + 0.08);
          });

          tl.fromTo("#s2-card", { y: -90, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.4)" }, tR);
          tl.fromTo("#s2-book path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, tR + 0.08);
          typeOn("#s2-title", tR + 0.12, 23, 0.46);
          tl.fromTo("#s2-card .s2-sweep i", { xPercent: -130 }, { xPercent: 330, duration: 0.8, ease: "power2.inOut" }, tR + 0.2);
          tl.fromTo("#s2-desc", { x: -28, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, tR + 0.3);
          tl.fromTo("#s2-star", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, tR + 0.4);
          tl.fromTo("#s2-totalwrap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, tR + 0.42);
          count(tR + 0.42, 160063, 1.1, (v) => { totalEl.textContent = fmt(v); });

          // chip "+8.319 tuần này": pop, count in accent, burst when it lands
          tl.fromTo("#s2-chip", { scale: 0.5, x: 40, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.28, ease: "back.out(1.7)" }, tS);
          tl.fromTo("#s2-arrow", { x: -10, y: 10, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)" }, tS + 0.1);
          count(tS + 0.04, 8319, 1.2, (v) => setTxt(chipEls, "+" + fmt(v)));
          const tDone = tS + 1.24;
          tl.fromTo("#s2-rays", { scale: 0.7, opacity: 0 }, { scale: 0.85, opacity: 1, duration: 0.06, ease: "none" }, tDone);
          tl.to("#s2-rays", { scale: 1.35, opacity: 0, duration: 0.42, ease: "power2.out" }, tDone + 0.06);
          pulse(tDone, "#s2-chipnum", 1.1);
          beats(tS + 0.3, tL - 0.2).filter((t) => t > tDone + 0.3 || t < tDone - 0.3).forEach((t) => pulse(t, "#s2-chipnum", 1.04));

          // ---------- whip to idea 2: badge CRT-off, card flies to the top ----------
          tl.to("#s2-toplbl span", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.16, ease: "steps(6)" }, tL - 0.3);
          tl.to("#s2-pips .s2-pip", { scaleX: 0, duration: 0.12, ease: "power2.in", stagger: 0.03 }, tL - 0.3);
          tl.to("#s2-badge-in", { scaleY: 0.02, duration: 0.11, ease: "power2.in" }, tL - 0.24);
          tl.to("#s2-badge-in", { scaleX: 0, duration: 0.09, ease: "power2.in" }, tL - 0.13);
          tl.to("#s2-card", { y: 200 - 890, scale: 0.8, duration: 0.5, ease: "power3.inOut" }, tL - 0.12);
          tl.to("#s2-cam", { y: -26, duration: 0.12, ease: "power2.in" }, tL - 0.14);
          tl.to("#s2-cam", { y: 0, duration: 0.32, ease: "back.out(1.3)" }, tL - 0.02);
          tl.to("#s2-stage", { filter: "blur(3px)", duration: 0.12, ease: "power2.in" }, tL - 0.14);
          tl.to("#s2-stage", { filter: "blur(0px)", duration: 0.24, ease: "power2.out" }, tL - 0.02);
          // accent leaves the chip: the next key number gets it later
          tl.to("#s2-chipnum .s2-acc", { opacity: 0, duration: 0.3, ease: "power1.out" }, tL);
          tl.to("#s2-chipnum .s2-neu", { opacity: 1, duration: 0.3, ease: "power1.out" }, tL);

          // ---------- sentence 2a: "Bộ luật" stamps in, code window streams 335 lines ----------
          tl.fromTo("#s2-rule", { scale: 1.4, rotation: -8, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.26, ease: "back.out(1.6)" }, tL + 0.1);
          tl.fromTo("#s2-shield path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, tL + 0.16);
          tl.fromTo("#s2-win", { scaleY: 0.02, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, tL + 0.2);
          tl.fromTo("#s2-win .s2-sweep i", { xPercent: -130 }, { xPercent: 330, duration: 0.8, ease: "power2.inOut" }, tL + 0.4);
          tl.fromTo("#s2-scroll", { y: 0 }, { y: SCROLL_END, duration: 1.2, ease: "power2.in" }, tL + 0.36);
          count(tL + 0.36, 335, 1.2, (v) => { linesEl.textContent = String(Math.round(v)); }, "power2.in");

          // "buộc AI": link draws, AI node spins in, data dots run law -> AI -> code
          tl.fromTo("#s2-link", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, tI - 0.92);
          tl.fromTo("#s2-ai", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.6)" }, tI - 0.7);
          tl.fromTo("#s2-vlink", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, tI - 0.5);
          const tOut = tC - 1.45;
          [0, 1, 2].forEach((j) => {
            const ts = tI - 0.62 + j * 0.18, d = 0.5, rd = 0.1;
            tl.fromTo("#s2-ld" + j, { opacity: 0 }, { opacity: 1, duration: 0.08 }, ts);
            tl.fromTo("#s2-ld" + j, { x: 0 }, { x: 496, duration: d, ease: "power1.inOut", repeat: Math.max(0, Math.floor((tOut - ts - d) / (d + rd))), repeatDelay: rd }, ts);
          });
          {
            const ts = tI - 0.3, d = 0.28, rd = 0.14;
            tl.fromTo("#s2-vdot", { opacity: 0 }, { opacity: 1, duration: 0.06 }, ts);
            tl.fromTo("#s2-vdot", { y: 0 }, { y: 48, duration: d, ease: "power1.in", repeat: Math.max(0, Math.floor((tOut - ts - d) / (d + rd))), repeatDelay: rd }, ts);
          }
          beats(tI - 0.3, tOut - 0.3).forEach((t) => pulse(t, "#s2-ai", 1.08));

          // ---------- "ít": tug-of-war squeeze, long scroll collapses into a short block ----------
          tl.fromTo("#s2-clampT", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "back.out(1.4)" }, tI - 0.28);
          tl.fromTo("#s2-clampB", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "back.out(1.4)" }, tI - 0.24);
          tl.to("#s2-win", { scaleY: 1.02, duration: 0.18, ease: "power2.out" }, tI - 0.22);
          tl.to("#s2-win", { x: 3, duration: 0.03, ease: "none", repeat: 5, yoyo: true }, tI - 0.2);
          // clamp: same look as top 858 / height 385, done with transform + clip-path (no layout snapping)
          tl.fromTo("#s2-win", { clipPath: "inset(0px 0px 0px 0px round 24px)" }, { scaleY: 1, y: 218, clipPath: "inset(0px 0px 435px 0px round 24px)", duration: 0.42, ease: "back.out(1.2)" }, tI);
          tl.to("#s2-win", { scaleX: 1.03, duration: 0.12, ease: "power2.out" }, tI + 0.05);
          tl.to("#s2-win", { scaleX: 1, duration: 0.3, ease: "back.out(2)" }, tI + 0.17);
          tl.to("#s2-clampT", { y: 220, duration: 0.42, ease: "back.out(1.2)" }, tI);
          tl.to("#s2-clampB", { y: -229, duration: 0.42, ease: "back.out(1.2)" }, tI);
          tl.to("#s2-scroll", { opacity: 0, scaleY: 0.3, duration: 0.2, ease: "power2.in" }, tI);
          tl.fromTo("#s2-short .s2-sl", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.24, ease: "back.out(1.5)", stagger: 0.04 }, tI + 0.16);
          tl.fromTo("#s2-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, tI + 0.42);
          tl.to("#s2-lineswrap", { opacity: 0.5, duration: 0.2, ease: "power1.out" }, tI + 0.5);
          tl.to(["#s2-clampT", "#s2-clampB"], { scaleX: 0, duration: 0.18, ease: "power2.in" }, tI + 0.64);

          // ---------- put-away of the rule row, one part per beat-ish ----------
          tl.to(["#s2-ld0", "#s2-ld1", "#s2-ld2", "#s2-vdot"], { opacity: 0, duration: 0.1 }, tOut);
          tl.to("#s2-vlink", { scaleY: 0, duration: 0.12, ease: "power2.in" }, tOut);
          tl.to("#s2-ai", { scale: 0, rotation: -90, duration: 0.16, ease: "back.in(1.6)" }, tOut + 0.05);
          tl.to("#s2-link", { scaleX: 0, duration: 0.16, ease: "power2.in" }, tOut + 0.1);
          tl.to("#s2-rule", { scaleY: 0.04, duration: 0.1, ease: "power2.in" }, tOut + 0.18);
          tl.to("#s2-rule", { scaleX: 0, duration: 0.1, ease: "power2.in" }, tOut + 0.28);

          // ---------- sentence 2b: window docks left, benchmark panel expands out of it ----------
          tl.to("#s2-win", { x: -48, clipPath: "inset(0px 436px 435px 0px round 24px)", duration: 0.42, ease: "power3.inOut" }, tC - 1.35);
          tl.fromTo("#s2-panel", { scaleX: 0.02, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, tC - 1.15);
          tl.fromTo("#s2-panel .s2-sweep i", { xPercent: -130 }, { xPercent: 330, duration: 0.8, ease: "power2.inOut" }, tC - 0.95);
          typeOn("#s2-note", tC - 1.0, 24, 0.4);
          tl.fromTo("#s2-panel .s2-legend > span", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "back.out(1.6)", stagger: 0.08 }, tC - 0.95);
          tl.fromTo("#s2-panel .s2-div", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, tC - 0.85);

          // tIn = entrance of the group, t = hit (bar shrink + number), both from anchors
          const group = (g, tIn, t, fa, pctSel, pctEls, keep, target) => {
            tl.fromTo(g + " .s2-gl", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.26, ease: "back.out(1.5)" }, tIn);
            tl.fromTo(g + " .s2-ghost", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tIn + 0.05);
            tl.fromTo(g + " .s2-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 0.08 }, tIn + 0.08);
            // tension, then the "after" bar gets pulled back to `keep`
            tl.to(fa, { x: 2, duration: 0.03, ease: "none", repeat: 5, yoyo: true }, t - 0.22);
            tl.to(fa, { scaleX: 1.02, duration: 0.12, ease: "power2.out" }, t - 0.14);
            tl.to(fa, { width: keep, scaleX: 1, duration: 0.5, ease: "back.out(1.3)" }, t);
            tl.fromTo(pctSel, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, t);
            count(t, target, 0.8, (v) => setTxt(pctEls, "-" + Math.round(v) + "%"));
          };
          group("#s2-g1", tC - 0.82, tC, "#s2-fa1", "#s2-pct1", p1Els, "47%", 53);
          beats(tC + 0.75, tT - 0.35).forEach((t) => pulse(t, "#s2-pct1", 1.04));
          // token group enters on "code và", shrinks on the "token" anchor
          group("#s2-g2", tT - 0.62, tT, "#s2-fa2", "#s2-pct2", p2Els, "55%", 45);
          // accent moves from -53% to -45%: one accent at a time
          tl.to("#s2-pct1 .s2-acc", { opacity: 0, duration: 0.3, ease: "power1.out" }, tT);
          tl.to("#s2-pct1 .s2-neu", { opacity: 1, duration: 0.3, ease: "power1.out" }, tT);
          beats(tT + 1.05, tE - 0.1).forEach((t) => pulse(t, "#s2-pct2", 1.04));
          pulse(tT + 1.0, "#s2-g2l", 1.12);

          // ---------- exit: CRT-off of the whole scene in the last 0.3 s ----------
          tl.fromTo("#s2-crt", { filter: "brightness(1)" }, { scaleY: 0.02, filter: "brightness(2)", duration: 0.14, ease: "power2.in", immediateRender: false }, tE);
          tl.to("#s2-crt", { scaleX: 0, duration: 0.12, ease: "power2.in" }, tE + 0.14);
          tl.to("#s2-crt", { opacity: 0, duration: 0.03 }, tE + 0.26);
          tl.fromTo("#s2-crtline", { opacity: 0, scaleX: 1 }, { opacity: 0.85, duration: 0.05 }, tE + 0.1);
          tl.to("#s2-crtline", { scaleX: 0, duration: 0.14, ease: "power2.in" }, tE + 0.15);
          tl.to("#s2-crtline", { opacity: 0, duration: 0.03 }, tE + 0.27);

          tl.set({}, {}, DUR);
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
