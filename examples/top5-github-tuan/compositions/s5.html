      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s5", key);
          const tl = gsap.timeline({ paused: true });
          const D = window.__vv.scenes["s5"].end - window.__vv.scenes["s5"].start; // 10.09
          const BEAT = 60 / 104, S = window.__vv.scenes["s5"].start;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          const h = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          const $ = (s) => document.querySelector(s);
          const BK = "back.out(1.4)";
          const pulse = (sel, t, s) => {
            tl.fromTo(sel, { scale: 1 }, { scale: s || 1.04, duration: 0.09, ease: "power2.out", immediateRender: false }, t);

          const tH = A("hang"), tR = A("repo"), tS = A("sao"), tC = A("html"), tV = A("video"), tX = A("dangxem");
          const T2 = beats(tC - 0.9, tC)[0]; // put-away of part 1 lands on the beat before "AI"

          // ---------- camera + stage ----------
          tl.fromTo("#s5-cam", { scale: 1 }, { scale: 1.04, duration: D, ease: "none" }, 0);
          tl.fromTo("#s5-stage", { x: 140, scale: 1.12, opacity: 0, filter: "blur(8px)" },
            { x: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0);

          // ---------- environment: packets on grid lines (hash, straight runs) ----------
          const amb = $("#s5-amb");
          const cols = ["var(--c1)", "var(--c2)", "var(--c3)"];

            const rot = horiz ? (dir > 0 ? 0 : 180) : (dir > 0 ? 90 : -90);

          tl.fromTo("#s5-con", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, tS - 0.15);

          tl.set("#s5-bdot", { opacity: 0 }, tV - 0.07 + 4 * 0.34);

          // frame L1 expands from the arrow tip (UI expand)
          tl.set("#s5-l1pos", { x: 378, y: 966, scale: 0.3, transformOrigin: "0 0" }, 0);
          tl.fromTo("#s5-l1", { scaleX: 0.15, scaleY: 0.02, opacity: 0, transformOrigin: "50% 0%" },

          tl.fromTo("#s5-rim1", { opacity: 0 }, { opacity: 0.9, duration: 0.08 }, tV + 0.3);
