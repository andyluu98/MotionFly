<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #_nen-root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
        #_nen-lift { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 0%, #1a1e28 0%, rgba(26, 30, 40, 0) 70%); }
        #_nen-glow { position: absolute; width: 1400px; height: 1400px; left: -520px; top: 820px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(110, 168, 255, 0.07), rgba(110, 168, 255, 0) 70%); }
        #_nen-grid { position: absolute; inset: 0;
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
            linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
          background-size: 192px 192px, 192px 192px, 48px 48px, 48px 48px;
          background-position: 12px 0, 12px 0, 12px 0, 12px 0; }
        #_nen-vig { position: absolute; inset: 0; background: radial-gradient(75% 60% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
      </style>
      <div id="_nen-root" data-composition-id="_nen" data-width="1080" data-height="1920">
        <div id="_nen-lift"></div>
        <div id="_nen-glow"></div>
        <div id="_nen-grid"></div>
        <div id="_nen-vig"></div>
      </div>
      <script>
        (() => {
          // The stage never moves on its own (style rule); only the cool glow breathes very slowly.
          const tl = gsap.timeline({ paused: true });
          const dur = Math.max(...Object.values(window.__vv.scenes).map((s) => s.end));
          tl.fromTo("#_nen-glow", { x: 0, opacity: 0.8 }, { x: 260, opacity: 1, duration: dur, ease: "none" }, 0);
          window.__timelines["_nen"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
