<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Scene s6: luong viec doc Agent > MCP > So lieu ban hang > Skill > Bao cao. Runtime keeps only <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* Each scene declares its fonts (HyperFrames lint: font_family_without_font_face). Paths are relative to index.html. */
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Regular.ttf"); font-weight: 400; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Medium.ttf"); font-weight: 500; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
        @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-ExtraBold.ttf"); font-weight: 800; }
        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: transparent;
          color: var(--ink);
          font-family: "Be Vietnam Pro", sans-serif;
        }
        #s6-root #s6-stage { position: absolute; inset: 0; }
        #s6-root #s6-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

        /* Brush strokes: ink = things, blue = process/signal, accent = the one thing that matters */
        #s6-root .ink, #s6-root .blue, #s6-root .acc {
          fill: none;
          stroke-width: var(--stroke, 7px);
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #s6-root .ink { stroke: var(--ink); }
        #s6-root .blue { stroke: var(--blue); }
        #s6-root .acc { stroke: var(--accent); stroke-width: 12px; }
        #s6-root .thin { stroke-width: 5px; }
        #s6-root .f-ink { fill: color-mix(in srgb, var(--ink) 11%, transparent); }
        #s6-root .f-blue { fill: color-mix(in srgb, var(--blue) 12%, transparent); }
        #s6-root .f-badge { fill: color-mix(in srgb, var(--accent) 16%, white); stroke: var(--accent); }
        #s6-root .f-paper { fill: color-mix(in srgb, var(--ink) 5%, white); }
        #s6-root .flow {
          fill: none;
          stroke: var(--blue);
          stroke-width: 13px;
          stroke-linecap: round;
          stroke-dasharray: 0.1 34;
          opacity: 0;
        }
        #s6-root .ai-text {
          font-family: "Be Vietnam Pro", sans-serif;
          font-weight: 800;
          font-size: 28px;
          fill: var(--accent-text);
          text-anchor: middle;
        }

        /* Handwritten labels revealed left to right */
        #s6-root .lbl {
          position: absolute;
          left: 500px;
          width: 508px;
          display: flex;
          align-items: center;
          font-weight: 700;
          font-size: 64px;
          line-height: 1.15;
          color: var(--ink);
          transform-origin: 0% 50%;
          clip-path: inset(-20% 100% -20% -3%);
        }
        #s6-root .lbl.two { font-size: 54px; line-height: 1.2; }
      </style>

      <div id="s6-root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-stage">
          <svg id="s6-svg" viewBox="0 0 1080 1920" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Agent: stick figure with AI badge -->
            <g id="s6-agent">
              <path id="s6-head" class="ink" />
              <path id="s6-torso" class="ink" />
              <path id="s6-armL" class="ink" />
              <path id="s6-armR" class="ink" />
              <path id="s6-legL" class="ink" />
              <path id="s6-legR" class="ink" />
              <path id="s6-badge" class="ink f-badge" />
              <text id="s6-aiText" class="ai-text" x="300" y="434">AI</text>
            </g>

            <!-- Arrow 1 through the MCP plug -->
            <path id="s6-a1" class="blue" />
            <g id="s6-plug">
              <path id="s6-plugBody" class="ink f-ink" />
              <path id="s6-plugHead" class="ink f-ink" />
              <path id="s6-plugD1" class="ink thin" />
              <path id="s6-plugD2" class="ink thin" />
            </g>
            <path id="s6-a2" class="blue" />
            <path id="s6-a2h" class="blue" />

            <!-- Bar chart: sales data -->
            <path id="s6-axV" class="ink" />
            <path id="s6-axH" class="ink" />
            <path id="s6-bar1" class="ink f-ink" />
            <path id="s6-bar2" class="ink f-ink" />
            <path id="s6-bar3" class="ink f-ink" />
            <path id="s6-bar4" class="ink f-ink" />

            <!-- Arrow 2 through the Skill notebook -->
            <path id="s6-b1" class="blue" />
            <g id="s6-nb">
              <path id="s6-nbCover" class="ink f-blue" />
              <path id="s6-ring1" class="ink thin" />
              <path id="s6-ring2" class="ink thin" />
              <path id="s6-ring3" class="ink thin" />
              <path id="s6-ring4" class="ink thin" />
              <path id="s6-ring5" class="ink thin" />
              <path id="s6-nbL1" class="ink thin" />
              <path id="s6-nbL2" class="ink thin" />
              <path id="s6-nbL3" class="ink thin" />
            </g>
            <path id="s6-b2" class="blue" />
            <path id="s6-b2h" class="blue" />

            <!-- Report page with orange tick -->
            <path id="s6-paper" class="ink f-paper" />
            <path id="s6-fold" class="ink thin" />
            <path id="s6-logo" class="ink thin" />
            <path id="s6-pl1" class="ink thin" />
            <path id="s6-pl2" class="ink thin" />
            <path id="s6-pl3" class="ink thin" />
            <path id="s6-tick" class="acc" />

            <!-- Signal dots marching along the arrows -->
            <path id="s6-fA1" class="flow" />
            <path id="s6-fA2" class="flow" />
            <path id="s6-fB1" class="flow" />
            <path id="s6-fB2" class="flow" />
          </svg>

          <div id="s6-lAgent" class="lbl" style="top: 282px; height: 80px;">Agent</div>
          <div id="s6-lMcp" class="lbl" style="top: 661px; height: 80px;">MCP</div>
          <div id="s6-lData" class="lbl two" style="top: 902px; height: 140px;">Số liệu bán hàng</div>
          <div id="s6-lSkill" class="lbl" style="top: 1152px; height: 80px;">Skill</div>
          <div id="s6-lReport" class="lbl" style="top: 1432px; height: 80px;">Báo cáo</div>
        </div>
      </div>

      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s6", key);
          const D = 6.19; // scene length (s), from the work packet
          const root = document.getElementById("s6-root");
          const $ = (id) => root.querySelector("#s6-" + id);

          // ---------- deterministic hand-drawn geometry (hash wobble, no Math.random) ----------
          const H = (n) => {
            const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
            return s - Math.floor(s) - 0.5;
          };
          const f = (v) => v.toFixed(1);
          const seg = (x1, y1, x2, y2, s, first) => {
            const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
            const n = Math.max(1, Math.round(L / 80)), nx = -dy / L, ny = dx / L;
            let d = first ? "M" + f(x1) + " " + f(y1) : "";
            for (let i = 0; i < n; i++) {
              const tm = (i + 0.5) / n, te = (i + 1) / n, o = H(s * 17 + i) * (n === 1 ? 6 : 9);
              d += " Q" + f(x1 + dx * tm + nx * o) + " " + f(y1 + dy * tm + ny * o) + " " + f(x1 + dx * te) + " " + f(y1 + dy * te);
            }
            return d;
          };
          const ln = (x1, y1, x2, y2, s) => seg(x1, y1, x2, y2, s, true);
          const poly = (p, s) => p.slice(1).reduce((d, q, i) => d + seg(p[i][0], p[i][1], q[0], q[1], s + i, i === 0), "");
          const rr = (x, y, w, h, r, s) => {
            const j = (k) => H(s * 7 + k) * 3.5;
            const x2 = x + w, y2 = y + h;
            return "M" + f(x + r) + " " + f(y + j(0)) +
              " L" + f(x2 - r) + " " + f(y + j(1)) +
              " Q" + f(x2 + j(2)) + " " + f(y + j(3)) + " " + f(x2 + j(4)) + " " + f(y + r) +
              " L" + f(x2 + j(5)) + " " + f(y2 - r) +
              " Q" + f(x2 + j(6)) + " " + f(y2 + j(7)) + " " + f(x2 - r) + " " + f(y2 + j(8)) +
              " L" + f(x + r) + " " + f(y2 + j(9)) +
              " Q" + f(x + j(10)) + " " + f(y2 + j(11)) + " " + f(x + j(12)) + " " + f(y2 - r) +
              " L" + f(x + j(13)) + " " + f(y + r) +
              " Q" + f(x + j(14)) + " " + f(y + j(15)) + " " + f(x + r + 8) + " " + f(y + j(0));
          };
          const circ = (cx, cy, r, s) => {
            const sw = 385, step = r < 20 ? 20 : 12, n = Math.ceil(sw / step);
            let d = "";
            for (let i = 0; i <= n; i++) {
              const a = ((-100 + (sw * i) / n) * Math.PI) / 180;
              const rad = r + (i / n) * Math.min(3, r * 0.1) + H(s * 31 + i) * Math.min(3, r * 0.12);
              d += (i ? " L" : "M") + f(cx + rad * Math.cos(a)) + " " + f(cy + rad * Math.sin(a));
            }
            return d;
          };
          const setD = (id, d) => $(id).setAttribute("d", d);

          // Agent (column centre x = 300)
          setD("head", circ(300, 322, 56, 1));
          setD("torso", ln(300, 378, 300, 500, 2));
          setD("armL", ln(300, 392, 236, 458, 3));
          setD("armR", ln(300, 392, 366, 450, 4));
          setD("legL", ln(300, 500, 254, 574, 5));
          setD("legR", ln(300, 500, 346, 574, 6));
          setD("badge", rr(262, 402, 76, 44, 10, 7));

          // Arrow 1 through the MCP plug
          setD("a1", ln(300, 594, 300, 632, 8));
          setD("plugBody", rr(266, 632, 68, 110, 34, 9));
          setD("plugHead", rr(282, 744, 36, 28, 12, 10));
          setD("plugD1", ln(286, 672, 314, 672, 11));
          setD("plugD2", ln(286, 702, 314, 702, 12));
          setD("a2", ln(300, 774, 300, 846, 13));
          setD("a2h", poly([[276, 826], [300, 858], [324, 826]], 14));
          setD("fA1", ln(300, 594, 300, 632, 8));
          setD("fA2", ln(300, 776, 300, 840, 13));

          // Bar chart
          setD("axV", ln(180, 884, 180, 1060, 15));
          setD("axH", ln(180, 1060, 424, 1060, 16));
          setD("bar1", rr(204, 990, 38, 70, 4, 17));
          setD("bar2", rr(260, 940, 38, 120, 4, 18));
          setD("bar3", rr(316, 965, 38, 95, 4, 19));
          setD("bar4", rr(372, 910, 38, 150, 4, 20));

          // Arrow 2 through the Skill notebook (3:4, 5 spiral rings on the left spine)
          setD("b1", ln(300, 1084, 300, 1112, 21));
          setD("nbCover", rr(240, 1112, 120, 160, 18, 22));
          for (let i = 0; i < 5; i++) setD("ring" + (i + 1), circ(240, 1132 + 28 * i, 9, 23 + i));
          setD("nbL1", ln(268, 1156, 336, 1156, 30));
          setD("nbL2", ln(268, 1186, 336, 1186, 31));
          setD("nbL3", ln(268, 1216, 310, 1216, 32));
          setD("b2", ln(300, 1272, 300, 1332, 33));
          setD("b2h", poly([[276, 1312], [300, 1344], [324, 1312]], 34));
          setD("fB1", ln(300, 1084, 300, 1112, 21));
          setD("fB2", ln(300, 1274, 300, 1322, 33));

          // Report page
          setD("paper", poly([[218, 1366], [350, 1366], [384, 1398], [384, 1572], [218, 1572], [218, 1380]], 40));
          setD("fold", poly([[350, 1366], [350, 1398], [384, 1398]], 46));
          setD("logo", rr(240, 1388, 40, 26, 5, 47));
          setD("pl1", ln(242, 1440, 360, 1440, 48));
          setD("pl2", ln(242, 1472, 360, 1472, 49));
          setD("pl3", ln(242, 1504, 320, 1504, 50));
          setD("tick", poly([[262, 1524], [306, 1562], [410, 1448]], 51));

          // ---------- timeline ----------
          const tl = gsap.timeline({ paused: true });
          const tA = A("agent"), tM = A("mcp"), tD = A("data"), tS = A("skill"), tR = A("report");

          // Pen stroke: dash draw, slow-fast-slow. fillDelay > 0 also fades the light fill in.
          const draw = (id, t, dur, withFill) => {
            const el = $(id);
            const L = el.getTotalLength() + 1;
            gsap.set(el, { opacity: 0, strokeDasharray: L, strokeDashoffset: L });
            tl.set(el, { opacity: 1 }, t);
            tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
            if (withFill) {
              gsap.set(el, { fillOpacity: 0 });
              tl.to(el, { fillOpacity: 1, duration: 0.25, ease: "power1.out" }, t + dur * 0.7);
            }
          };
          // Handwritten label: clip-path inset left to right with a slight tilt
          const write = (id, t, dur, r0, r1) => {
            tl.fromTo($(id),
              { clipPath: "inset(-20% 100% -20% -3%)", rotation: r0 },
              { clipPath: "inset(-20% -3% -20% -3%)", rotation: r1, duration: dur, ease: "power2.inOut" }, t);
          };

          // Enter: slide up on the stage wrapper
          tl.fromTo("#s6-stage", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0);

          // 1) Agent
          draw("head", tA - 0.5, 0.4);
          draw("torso", tA - 0.15, 0.2);
          draw("armL", tA - 0.1, 0.18);
          draw("armR", tA - 0.08, 0.18);
          draw("legL", tA - 0.02, 0.2);
          draw("legR", tA, 0.2);
          draw("badge", tA + 0.05, 0.3, true);
          gsap.set($("aiText"), { opacity: 0 });
          tl.to($("aiText"), { opacity: 1, duration: 0.15 }, tA + 0.3);
          write("lAgent", tA + 0.06, 0.45, -1, 0.5);

          // 2) MCP plug and arrow down to the data
          draw("a1", tA + 0.18, 0.2);
          draw("plugBody", tM - 0.25, 0.4, true);
          draw("plugHead", tM + 0.1, 0.15, true);
          draw("plugD1", tM + 0.2, 0.15);
          draw("plugD2", tM + 0.27, 0.15);
          write("lMcp", tM, 0.4, 1, -0.5);
          draw("a2", tM + 0.25, 0.3);
          draw("a2h", tD - 0.1, 0.15);

          // 3) Sales data bar chart
          draw("axV", tD - 0.05, 0.3);
          draw("axH", tD + 0.05, 0.3);
          ["bar1", "bar2", "bar3", "bar4"].forEach((id, i) => draw(id, tD + 0.25 + i * 0.12, 0.3, true));
          write("lData", tD + 0.1, 0.7, -0.8, 0.6);

          // 4) Skill notebook
          draw("b1", tS - 0.58, 0.2);
          draw("nbCover", tS - 0.45, 0.4, true);
          for (let i = 0; i < 5; i++) draw("ring" + (i + 1), tS - 0.2 + i * 0.05, 0.15);
          draw("nbL1", tS, 0.15);
          draw("nbL2", tS + 0.08, 0.15);
          draw("nbL3", tS + 0.16, 0.15);
          write("lSkill", tS, 0.4, 0.8, -0.6);
          draw("b2", tS + 0.2, 0.3);
          draw("b2h", tR - 0.2, 0.15);

          // 5) Report page, then the orange tick on "dung mau"
          draw("paper", tR - 0.15, 0.6, true);
          draw("logo", tR + 0.35, 0.15);
          draw("fold", tR + 0.4, 0.15);
          draw("pl1", tR + 0.2, 0.2);
          draw("pl2", tR + 0.3, 0.2);
          draw("pl3", tR + 0.4, 0.2);
          write("lReport", tR, 0.5, -0.9, 0.5);
          draw("tick", tR + 0.55, 0.3);
          tl.fromTo($("tick"), { scale: 1 },
            { scale: 1.12, svgOrigin: "340 1500", duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, tR + 0.88);

          // ---------- living motion until the scene settles (about 0.3 s before exit) ----------
          const settle = D - 0.35 - 0.3; // 5.54
          // Agent waves one arm
          tl.fromTo($("armR"), { rotation: 0, svgOrigin: "300 392" },
            { rotation: 12, svgOrigin: "300 392", duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 7 }, tA + 0.25);
          // Bars breathe
          [[223, 0], [279, 1], [335, 2], [391, 3]].forEach(([cx, i], k) => {
            const bar = $("bar" + (k + 1));
            tl.fromTo(bar, { scaleY: 1, svgOrigin: cx + " 1060" },
              { scaleY: 1.07, svgOrigin: cx + " 1060", duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3 }, tD + 1.0 + i * 0.1);
          });
          // Notebook rocks slightly
          tl.fromTo($("nb"), { rotation: 0, svgOrigin: "300 1192" },
            { rotation: 1.4, svgOrigin: "300 1192", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, tS + 0.2);
          // Signal dots march along the arrows
          const flow = (id, t0) => {
            const el = $(id);
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0);
            tl.fromTo(el, { strokeDashoffset: 0 }, { strokeDashoffset: -60 * (settle - t0), duration: settle - t0, ease: "none" }, t0);
            tl.to(el, { opacity: 0, duration: 0.12 }, settle - 0.12);
          };
          flow("fA1", tD + 0.1);
          flow("fA2", tD + 0.1);
          flow("fB1", tS - 0.25);
          flow("fB2", tR);

          // Exit: slide up and fade on the stage wrapper
          tl.to("#s6-stage", { y: -120, opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.35);

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
