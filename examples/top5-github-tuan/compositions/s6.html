                  <div class="tile-c"><div class="ico-w"><svg viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="44" rx="7" /><path d="M18 24l4 4 7-8M18 40l4 4 7-8M35 24h11M35 40h11" /></svg></div>
                    <div class="tile-lb mono">productivity</div><div class="tile-no mono">08</div></div></div></div>
              </div>
              <div class="tile" id="s6-t-search" style="left: 120px; top: 436px">
                <div class="tile-s"><div class="tile-glow"></div><div class="tile-in"><div class="tile-lit"></div>
                  <div class="tile-c"><div class="ico-w"><svg viewBox="0 0 64 64"><circle cx="28" cy="28" r="15" /><path d="M39 39l14 14" /></svg></div>
                    <div class="tile-lb mono">search</div><div class="tile-no mono">09</div></div></div></div>
              </div>
              <div class="tile" id="s6-t-bio" style="left: 360px; top: 436px">
                <div class="tile-s"><div class="tile-glow"></div><div class="tile-in"><div class="tile-lit"></div>
                  <div class="tile-c"><div class="ico-w"><svg viewBox="0 0 64 64"><circle cx="20" cy="18" r="7" /><circle cx="47" cy="26" r="6" /><circle cx="27" cy="47" r="8" /><path d="M27 20l14 4M22 25l3 14M43 31 33 41" /></svg></div>
                    <div class="tile-lb mono">bio</div><div class="tile-no mono">10</div></div></div></div>
              </div>
              <div class="tile" id="s6-t-plugin" style="left: 600px; top: 436px">
                <div class="tile-s"><div class="tile-glow"></div><div class="tile-in"><div class="tile-lit"></div>
                  <div class="tile-c"><div class="ico-w"><svg viewBox="0 0 64 64"><path d="M24 8v12M40 8v12" /><path d="M16 20h32v10a16 16 0 0 1-32 0z" /><path d="M32 46v10" /></svg></div>
                    <div class="tile-lb mono">plugin</div><div class="tile-no mono">11</div></div></div></div>
              </div>
            </div>

            <!-- no-code line -->
            <div id="s6-coderow">
              <div id="s6-code"><span class="cd-g mono">&lt;/&gt;</span><span class="cd-t mono">code</span><i id="s6-cdc"></i><i id="s6-strike"></i></div>
            </div>
            <div id="s6-hl"><span class="w"><span class="wi" id="s6-w0">KHÔNG</span></span> <span class="w"><span class="wi" id="s6-w1">CẦN</span></span> <span class="w"><span class="wi" id="s6-w2">VIẾT</span></span> <span class="w"><span class="wi" id="s6-w3">CODE</span></span></div>
            <div id="s6-hlbar"></div>
          </div>
        </div>

        <div id="s6-crt"></div>
      </div>

      <script>
        (() => {
          // A("key") = local time (s) of an anchor from timeline.json; never hard-code word times.
          const A = (key) => window.__vv.local("s6", key);
          const SC = window.__vv.scenes["s6"];
          const S = SC.start;
          const D = SC.end - SC.start;
          const BEAT = 60 / 104;
          const SIX = BEAT / 4;
          const beats = (from, to) => { const o = []; for (let k = Math.ceil((S + from) / BEAT); k * BEAT - S <= to; k++) o.push(k * BEAT - S); return o; };
          const sixAfter = (t) => Math.ceil((S + t) / SIX - 1e-9) * SIX - S;
          // deterministic hash in [0,1)
          const h = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
          // Vietnamese thousands separator: 28565 -> "28.565"
          const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          const el = (id) => document.getElementById(id);
          const NI = { immediateRender: false };

          const tl = gsap.timeline({ paused: true });

          // ---------- camera: slow push-in, whip-in entry ----------
          tl.fromTo("#s6-cam", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);
          tl.fromTo("#s6-stage", { scale: 1.12, x: 160, filter: "blur(8px)", opacity: 0 },
            { scale: 1, x: 0, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#s6-env", { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 0.8, duration: 0.4, ease: "power3.out" }, 0);

          // ---------- environment: 18 data packets hopping along the 48px grid on the beat ----------
          const env = el("s6-env");
          const COLS = ["var(--c1)", "var(--c2)", "var(--c3)"];
          const B = beats(0, D);
          const snapX = (v) => 12 + 48 * Math.round((v - 12) / 48);
          const snapY = (v) => 48 * Math.round(v / 48);
          const hopEase = (n, frac) => (p) => {
            if (p >= 1) return 1;
            const q = p * n, k = Math.floor(q), f = Math.min(1, (q - k) / frac);
            const s = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
            return (k + s) / n;
          };
          for (let i = 0; i < 18; i++) {
            const horiz = h(i, 1) < 0.55;
            const dir = h(i, 2) < 0.5 ? 1 : -1;
            const cells = h(i, 3) < 0.55 ? 1 : 2;
            const stride = h(i, 9) < 0.5 ? 1 : 2;
            const b0 = Math.floor(h(i, 4) * 3);
            const d = 6 + Math.floor(h(i, 5) * 5);
            const L = 48 + Math.floor(h(i, 6) * 72);
            const col = COLS[i % 3];
            const interval = stride * BEAT;
            const hops = B.filter((b, k) => k >= b0 && (k - b0) % stride === 0 && b - 0.12 + interval <= D - 0.05);
            const n = hops.length;
            if (!n) continue;
            const st = hops[0] - 0.12;
            const travel = n * cells * 48 * dir;
            let x0, y0, x1, y1, rot;
            if (horiz) {
              y0 = y1 = 48 * (3 + Math.floor(h(i, 7) * 31));
              x0 = snapX(540 - travel / 2 + (h(i, 8) - 0.5) * 480);
              x1 = x0 + travel;
              rot = dir > 0 ? 0 : 180;
            } else {
              x0 = x1 = snapX(72 + h(i, 7) * 936);
              y0 = snapY(900 - travel / 2 + (h(i, 8) - 0.5) * 480);
              y1 = y0 + travel;
              rot = dir > 0 ? 90 : -90;
            }
            const pk = document.createElement("div");
            pk.className = "pk";
            const r = document.createElement("div");
            r.className = "pk-r";
            r.style.cssText = `width:${L + d}px;height:${d}px;left:${-(L + d / 2)}px;top:${-d / 2}px;transform-origin:${L + d / 2}px ${d / 2}px;transform:rotate(${rot}deg)`;
            r.innerHTML = `<i class="pk-t" style="width:${L}px;top:${(d - 2) / 2}px;background:linear-gradient(90deg, rgba(0,0,0,0), ${col})"></i>` +
              `<b class="pk-d" style="left:${L}px;width:${d}px;height:${d}px;background:${col};box-shadow:0 0 12px ${col}"></b>`;
            pk.appendChild(r);
            env.appendChild(pk);
            tl.fromTo(pk, { x: x0, y: y0 }, { x: x1, y: y1, duration: n * interval, ease: hopEase(n, 0.3 / interval) }, st);
          }

          // ---------- sentence 1: "#5 ... plugin chính chủ của Anthropic ... 2.601 sao" ----------
          const tH = A("hang");
          tl.fromTo("#s6-badge-in", { yPercent: 105 }, { yPercent: 0, duration: 0.45, ease: "power4.out" }, tH);
          tl.fromTo("#s6-bsw", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.8, ease: "power2.inOut" }, tH + 0.25);
          tl.fromTo("#s6-rank", { scaleX: 1.35, opacity: 0, transformOrigin: "0% 50%" }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, tH + 0.3);
          tl.fromTo("#s6-title", { x: 70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "back.out(1.4)" }, tH + 0.85);

          // rail draws, a packet runs along it on the beat
          tl.fromTo("#s6-railw", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.6, ease: "power3.out" }, tH + 0.3);
          const r0 = beats(tH + 0.6, D)[0];
          tl.fromTo("#s6-raildot", { x: 0 }, { x: 936, duration: 2 * BEAT, ease: "power2.inOut", repeat: 2 }, r0);

          // repo card slides up, name types in, light sweeps across
          const tR = A("repo");
          tl.fromTo("#s6-card", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.3)" }, tR - 0.04);
          tl.fromTo("#s6-repo", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(22)" }, tR + 0.1);
          tl.fromTo("#s6-csweep", { x: -300 }, { x: 1240, duration: 0.9, ease: "power2.inOut" }, tR + 0.15);
          tl.fromTo("#s6-owner", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, tR + 0.08);

          // stars: chip pops, weekly +2.601 and total 28.565 count together
          const tS = A("sao");
          const CNT = 1.2;
          tl.fromTo("#s6-chip", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, tS - 0.05);
          tl.fromTo("#s6-stico", { rotation: -144 }, { rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, tS);
          const wk = { v: 0 };
          tl.fromTo(wk, { v: 0 }, { v: 2601, duration: CNT, ease: "power3.out", onUpdate: () => { el("s6-chipn").textContent = "+" + fmt(wk.v); } }, tS);
          const tot = { v: 25964 };
          tl.fromTo(tot, { v: 25964 }, { v: 28565, duration: CNT, ease: "power3.out", onUpdate: () => { el("s6-total").textContent = fmt(tot.v); } }, tS);
          // sparkle burst when the count lands
          const spk = el("s6-spk");
          for (let i = 0; i < 8; i++) {
            const s = document.createElement("div");
            s.className = "spk";
            s.innerHTML = '<svg viewBox="-10 -10 20 20"><path d="M0-10 2.5-2.5 10 0 2.5 2.5 0 10-2.5 2.5-10 0-2.5-2.5z" /></svg>';
            spk.appendChild(s);
            const a = (i / 8) * Math.PI * 2 + 0.3;
            const dist = 150 + 30 * h(i, 11);
            const ry = 0.42; // flatten the burst to the chip's pill shape
            tl.fromTo(s, { x: 0, y: 0, scale: 0, rotation: 0, opacity: 1 },
              { x: Math.cos(a) * dist, y: Math.sin(a) * dist * ry, scale: 1, rotation: 90, duration: 0.42, ease: "power3.out" }, tS + CNT - 0.05);
            tl.fromTo(s, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in", ...NI }, tS + CNT + 0.37);
          }
          // beat pulses: star glyph and weekly chip
          beats(tS + 0.6, D - 0.4).forEach((b) => {
            tl.fromTo("#s6-stico", { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out", ...NI }, b);
            tl.fromTo("#s6-stico", { scale: 1.12 }, { scale: 1, duration: 0.2, ease: "power2.out", ...NI }, b + 0.08);
          });
          beats(tS + CNT + 0.1, D - 0.4).forEach((b) => {
            tl.fromTo("#s6-chip", { scale: 1 }, { scale: 1.05, duration: 0.08, ease: "power2.out", ...NI }, b);
            tl.fromTo("#s6-chip", { scale: 1.05 }, { scale: 1, duration: 0.2, ease: "power2.out", ...NI }, b + 0.08);
          });

          // ---------- transition: head CRT-off, rail retracts, whip, card flies up ----------
          const tM = A("muoimot");
          const T2 = tM - 0.45;
          tl.fromTo("#s6-head", { scaleY: 1 }, { scaleY: 0.02, duration: 0.12, ease: "power2.in" }, T2);
          tl.fromTo("#s6-head", { scaleX: 1 }, { scaleX: 0, duration: 0.1, ease: "power2.in", ...NI }, T2 + 0.12);
          tl.fromTo("#s6-head", { opacity: 1 }, { opacity: 0, duration: 0.02, ...NI }, T2 + 0.2);
          tl.fromTo("#s6-railw", { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power3.in", ...NI }, T2);
          tl.fromTo("#s6-cam", { y: 0 }, { y: -40, duration: 0.14, ease: "power2.in" }, T2 + 0.05);
          tl.fromTo("#s6-cam", { y: -40 }, { y: 0, duration: 0.4, ease: "back.out(1.3)", ...NI }, T2 + 0.19);
          tl.fromTo("#s6-stage", { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.12, ease: "power2.in", ...NI }, T2 + 0.07);
          tl.fromTo("#s6-stage", { filter: "blur(5px)" }, { filter: "blur(0px)", duration: 0.25, ease: "power2.out", ...NI }, T2 + 0.19);
          tl.fromTo("#s6-card", { y: 0 }, { y: -660, duration: 0.5, ease: "back.out(1.2)", ...NI }, T2 + 0.08);
          tl.fromTo("#s6-card", { scale: 1 }, { scale: 0.86, duration: 0.5, ease: "power3.out" }, T2 + 0.08);
          tl.fromTo("#s6-card", { x: 0, rotation: 0 }, { x: 40, rotation: -1.5, duration: 0.22, ease: "power2.out" }, T2 + 0.08);
          tl.fromTo("#s6-card", { x: 40, rotation: -1.5 }, { x: 0, rotation: 0, duration: 0.34, ease: "back.out(1.4)", ...NI }, T2 + 0.3);

          // ---------- sentence 2: "Mười một plugin ..." ----------
          tl.fromTo("#s6-cnt", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, tM);
          tl.fromTo(".mk", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.6)", stagger: 0.05 }, tM);
          // 11 tiles pop on consecutive sixteenth notes
          const ORDER = ["sales", "support", "product", "marketing", "legal", "finance", "data", "productivity", "search", "bio", "plugin"];
          const t0 = sixAfter(tM + 0.08);
          ORDER.forEach((k, i) => {
            tl.fromTo("#s6-t-" + k, { y: 50, scale: 0.5, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.7)" }, t0 + i * SIX);
          });
          const cnt = { v: 0 };
          tl.fromTo(cnt, { v: 0 }, { v: 11, duration: 11 * SIX, ease: "none", onUpdate: () => {
            const n = Math.min(11, Math.floor(cnt.v + 1e-6));
            el("s6-cntn").textContent = (n < 10 ? "0" : "") + n;
          } }, t0 - SIX);
          const tDone = t0 + 11 * SIX;
          beats(tDone, D - 0.4).forEach((b) => {
            tl.fromTo("#s6-cntn", { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out", ...NI }, b);
            tl.fromTo("#s6-cntn", { scale: 1.08 }, { scale: 1, duration: 0.2, ease: "power2.out", ...NI }, b + 0.08);
          });
          // grid markers tick a quarter turn on every beat
          beats(tM + 0.45, D - 0.4).forEach((b, k) => {
            tl.fromTo(".mk", { rotation: k * 90 }, { rotation: (k + 1) * 90, duration: 0.22, ease: "back.out(1.4)", ...NI }, b - 0.04);
          });

          // "biến Claude thành trợ lý": chip flings in, arrow draws, packet flows to "Trợ lý"
          const tSa = A("sales");
          tl.fromTo("#s6-cl", { x: 140, rotation: 6, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(1.4)" }, tSa - 0.75);
          tl.fromTo("#s6-clpath", { strokeDashoffset: 120 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, tSa - 0.6);
          tl.fromTo("#s6-clto", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "back.out(1.8)" }, tSa - 0.35);
          const c0 = beats(tSa - 0.45, D)[0];
          const cN = Math.max(0, Math.floor((D - 0.35 - c0) / BEAT) - 1);
          tl.fromTo("#s6-cldot", { x: 0, opacity: 1 }, { x: 84, duration: 0.42, ease: "power1.in", repeat: cN, repeatDelay: BEAT - 0.42 }, c0);

          // sales / kế toán / pháp chế: the three tiles scale up and light up, the rest dim
          tl.fromTo("#s6-grid .tile:not(#s6-t-sales) .tile-s", { opacity: 1 }, { opacity: 0.38, duration: 0.3, ease: "power2.out" }, tSa);
          const lightUp = (key, t, dimmed) => {
            const id = "#s6-t-" + key;
            if (dimmed) {
              tl.fromTo(id + " .tile-s", { opacity: 0.38, scale: 1 }, { opacity: 1, scale: 1.12, duration: 0.34, ease: "back.out(1.6)", ...NI }, t);
            } else {
              tl.fromTo(id + " .tile-s", { scale: 1 }, { scale: 1.12, duration: 0.34, ease: "back.out(1.6)" }, t);
            }
            tl.fromTo(id + " .tile-glow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
            tl.fromTo(id + " .tile-lit", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
            tl.fromTo(id + " .tile-c", { filter: "brightness(1)" }, { filter: "brightness(1.6)", duration: 0.25, ease: "power2.out" }, t);
            tl.fromTo(id + " .tile-sw", { x: -160 }, { x: 260, duration: 0.6, ease: "power2.inOut" }, t + 0.05);
            tl.fromTo(id + " .tag", { y: -34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, t + 0.06);
            beats(t + 0.35, D - 0.4).forEach((b) => {
              tl.fromTo(id + " .ico-w", { scale: 1 }, { scale: 1.1, duration: 0.08, ease: "power2.out", ...NI }, b);
              tl.fromTo(id + " .ico-w", { scale: 1.1 }, { scale: 1, duration: 0.2, ease: "power2.out", ...NI }, b + 0.08);
            });
          };
          lightUp("sales", tSa, false);
          lightUp("finance", A("ketoan"), true);
          lightUp("legal", A("phapche"), true);

          // "mà không cần viết code": code pill drops, words rise, code gets struck and deleted
          const tN = A("nocode");
          tl.fromTo("#s6-code", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "bounce.out" }, tN - 0.02);
          tl.fromTo("#s6-cdc", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "steps(1)", repeat: 3, yoyo: true }, tN + 0.1);
          [0.1, 0.28, 0.48, 0.7].forEach((dt, i) => {
            tl.fromTo("#s6-w" + i, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, tN + dt);
          });
          tl.fromTo("#s6-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, tN + 0.62);
          tl.fromTo("#s6-hlbar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, tN + 0.76);
          tl.fromTo("#s6-code", { scaleY: 1 }, { scaleY: 0.04, duration: 0.1, ease: "power2.in" }, tN + 0.82);
          tl.fromTo("#s6-code", { scaleX: 1 }, { scaleX: 0, duration: 0.08, ease: "power2.in", ...NI }, tN + 0.92);

          // ---------- exit: CRT-off of the whole stage in the last 0.3 s ----------
          const TE = D - 0.3;
          tl.fromTo("#s6-stage, #s6-env", { scaleY: 1 }, { scaleY: 0.02, duration: 0.16, ease: "power3.in", ...NI }, TE);
          tl.fromTo("#s6-stage, #s6-env", { scaleX: 1 }, { scaleX: 0, duration: 0.12, ease: "power2.in", ...NI }, TE + 0.16);
          tl.fromTo("#s6-crt", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, TE + 0.12);
          tl.fromTo("#s6-crt", { scaleX: 1 }, { scaleX: 0, duration: 0.12, ease: "power2.in" }, TE + 0.16);

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
